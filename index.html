/* INPUT MODES */
async function handleMode(val){
  const mode=S.inputMode;S.inputMode=null;$ci.type='text';
  if(mode==='login_pass'){const{name,profile}=S.inputCtx;const h=await hash(val);if(h===profile.passwordHash)finishLogin(name,profile);else log('AUTH_FAILURE: INCORRECT PASSWORD.','err');return;}
  if(mode==='pub_name'){
    const name=val.trim().replace(/\s+/g,'_').replace(/[^a-zA-Z0-9._-]/g,'_');
    if(!name){log('INVALID NAME. Try again with --pub =library','err');return;}
    await publishToLibrary(name, S.inputCtx.body);
    return;
  }

  if(mode==='enc_set'){if(val.length<3){log('PASSWORD TOO SHORT (min 3).','err');return;}const h=await hash(val);S.profile.encrypted=true;S.profile.passwordHash=h;await saveUser(S.user,S.profile);if(MEM[S.user.toLowerCase()]?.passwordHash===h)log('ENCRYPTION SET. Account is now password-protected.','ok');else log('ENCRYPTION_WARN: unexpected mismatch.','err');return;}
  if(mode==='enc_verify'){const stored=MEM[S.user.toLowerCase()]||lsGet(S.user.toLowerCase());const h=await hash(val);if(!stored||h!==stored.passwordHash){log('AUTH_FAILURE.','err');return;}log('VERIFIED. Enter NEW PASSWORD (blank = remove):','sys');$ci.type='password';S.inputMode='enc_new';return;}
  if(mode==='enc_new'){if(!val){S.profile.encrypted=false;S.profile.passwordHash=null;await saveUser(S.user,S.profile);log('ENCRYPTION REMOVED.','ok');}else{if(val.length<3){log('PASSWORD TOO SHORT.','err');return;}const h=await hash(val);S.profile.encrypted=true;S.profile.passwordHash=h;await saveUser(S.user,S.profile);log('PASSWORD UPDATED.','ok');}return;}
  if(mode==='root_id'){if(val==='wolfspyke86'){log('ROOT_ID ACCEPTED. ENTER ROOT PASSWORD:','sys');$ci.type='password';S.inputMode='root_pw';}else log('ROOT AUTH FAILURE.','err');return;}
  if(mode==='root_pw'){if(val==='winniebentoandze'){const{target}=S.inputCtx;const p=await loadUser(target);if(!p){log('USER NOT FOUND: '+target,'err');return;}p.isRoot=true;await saveUser(target,p);if(S.user?.toLowerCase()===target){S.profile.isRoot=true;updatePrompt();}log(`ROOT ELEVATION GRANTED: ${target.toUpperCase()} is now SUPER-ROOT.`,'ok');}else log('ROOT AUTH FAILURE.','err');return;}
}

/* EXEC */
async function exec(raw){
  const input=raw.trim();if(!input)return;
  S.cmdHist.unshift(input);if(S.cmdHist.length>200)S.cmdHist.pop();S.cmdIdx=-1;
  if(S.inputMode){log('&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;','usr');await handleMode(input);return;}
  logCmd(input);
  const lo=input.toLowerCase(),parts=input.split(/\s+/),cmd=parts[0].toLowerCase(),args=parts.slice(1);

  if(cmd==='--usr'){
    const arg=args[0];if(!arg?.startsWith('.')){log('USAGE: --usr .(username)','err');return;}
    const name=arg.slice(1).toLowerCase().replace(/[^a-z0-9_]/g,'');if(!name){log('INVALID USERNAME.','err');return;}
    log(`BOOTING USER: ${name.toUpperCase()}...`,'sys');
    let profile=await loadUser(name);
    if(!profile){profile=await createUser(name);log(`NEW USER CREATED: ${name.toUpperCase()}`,'sys');}
    if(profile.encrypted===true&&typeof profile.passwordHash==='string'&&profile.passwordHash.length===64){
      log(`SECURE ACCOUNT. ENTER PASSWORD FOR ${name.toUpperCase()}:`,'sys');$ci.type='password';S.inputMode='login_pass';S.inputCtx={name,profile};
    }else finishLogin(name,profile);
    return;
  }
  // ── ALIAS RESOLUTION ─────────────────────────
  // Check if input matches a user-defined alias
  if(S.user && S.aliases[lo]){
    const resolved=S.aliases[lo];
    log(`ALIAS: ${lo} &#x2192; ${resolved}`,'sys');
    await exec(resolved);
    return;
  }
  // Check first word alias too
  const firstWord=lo.split(/\s+/)[0];
  if(S.user && S.aliases[firstWord] && firstWord!==lo){
    const resolved=S.aliases[firstWord]+' '+parts.slice(1).join(' ');
    log(`ALIAS: ${firstWord} &#x2192; ${resolved.trim()}`,'sys');
    await exec(resolved.trim());
    return;
  }

  // ── NATURAL LANGUAGE RESOLUTION ──────────────
  const nlResolved=nlResolve(input);
  if(nlResolved && nlResolved!==input){
    await exec(nlResolved);
    return;
  }

  if(!S.user&&cmd!=='--help'&&cmd!=='--library'&&!(cmd==='--store'&&(args[0]==='list'||args[0]==='browse'||!args[0]))){log('NOT LOGGED IN. Use: --usr .(username)','err');return;}
  if(cmd==='--help'){
    const cat=args[0]?.toLowerCase();
    const CATS={
      session:   [['--usr .(name)','Sign in / create account'],['--end','End session'],['--endx','Close last window'],['--encrypt -usr','Set password'],['--encrypt -usr -reset','Change/remove password'],['--whoami','Who am I'],['--uptime','Session uptime'],['--neofetch','System info card'],['--home','Return to terminal from any app']],
      files:     [['--saves','List your saved files'],['--save (file)','Save last AI output'],['--load (file)','Load & launch a file'],['--list','List all bucket files'],['.disk -list','Organised bucket view'],['--edit (file)','Open code/text editor'],['--export','Download session as JSON'],['--screenshot / --ss','Save terminal as HTML'],['cd| (name)','Open encrypted folder'],['--cd build dir (name)','Create encrypted folder'],['--cd ls','List your folders']],
      ai:        [['(anything)','Talk to KERNEL &#x2014; AI core'],['--code (desc)','Generate code'],['--debug (code)','Debug code/error'],['--analyze (data)','Deep analysis'],['--brainstorm (topic)','15 rapid ideas'],['--eli5 (topic)','Explain like I am 5'],['--roast (code)','Brutal code review'],['--commit (desc)','Git commit messages'],['--regex (desc)','Regex builder'],['--plan (goal)','Step-by-step plan'],['--summarize (text/url)','Summarize anything'],['--debate (topic)','Balanced debate'],['--translate (lang) (text)','Translate text']],
      creative:  [['make game (desc)','Generate + launch HTML5 game'],['make multiplayer game (desc)','Multiplayer game in your room'],['make solo game (desc)','Single-player only game'],['make ascii (desc)','ASCII art in terminal'],['--ascii (desc)','ASCII art shorthand'],['--banner (text)','Big ASCII banner'],['--story (prompt)','Short story'],['--poem (about)','Poem'],['--mock (desc)','UI mockup window'],['--palette (mood)','Color palette generator'],['--pixel (size)','Pixel art editor'],['--draw','Whiteboard canvas'],['--md (text)','Markdown viewer'],['--matrix','Matrix rain window'],['--music / --radio','Audio stream + visualizer']],
      social:    [['--room (name)','Join a shared room'],['--room invite (user)','Invite user to room'],['--room who','See whos online'],['--room leave','Leave room'],['/say (msg)','Chat in room'],['--venom','Open Venom messenger'],['--venom (user)','Open DM with user'],['--game list','Active multiplayer games'],['--game join (id)','Join a game session'],['--game invite (user) (id)','Invite to game'],['--game leave','Leave game session']],
      library:   [['--library','Browse public Library'],['--library run (name)','Launch from Library'],['--library remove (name)','Remove your entry'],['--pub =library (file)','Publish to Library'],['--store','Browse App Store'],['--store install (id)','Install an app'],['--store uninstall (id)','Remove an app'],['--store installed','List installed apps']],
      tools:     [['--calc (expr)','Calculator'],['--convert (val) (from) (to)','Unit converter'],['--weather (city)','Current weather'],['--time (city)','World clock'],['--net','IP & network info'],['--speedtest','Download speed test'],['--diff (a) ||| (b)','Text diff'],['--clip','Clipboard manager'],['--search (q)','Search command history'],['--history (n)','Show conversation history']],
      productivity:[['--todo (add/done/remove)','Todo list'],['--note (set/get)','Quick notes'],['--journal (write/list)','Journal entries'],['--habit (add/done)','Habit tracker'],['--pomo (mins)','Pomodoro timer'],['--bm (add/open)','Bookmarks'],['--flash (study/add)','Flashcard decks'],['--sleep log (hrs)','Sleep tracker'],['--quote','Random dev quote'],['--run (script.dc)','.dc script runner']],
      identity:  [['--profile','Your profile card'],['--profile (user)','View any profile'],['--profile edit name/bio','Edit display name / bio'],['--theme font/scanline/cursor','Customise terminal look'],['--memory','AI memory viewer'],['--memory add/remove/clear','Manage AI memories'],['--alias set (k) (cmd)','Create command shortcut'],['--alias list / remove','Manage aliases']],
    };
    const names={session:'SESSION',files:'FILES',ai:'AI & WRITING',creative:'CREATIVE & GAMES',social:'SOCIAL & MULTIPLAYER',library:'LIBRARY & STORE',tools:'TOOLS & UTILS',productivity:'PRODUCTIVITY',identity:'IDENTITY & THEME'};
    if(cat && CATS[cat]){
      let h='<div class="hb"><div style="color:var(--accent);font-weight:900;margin-bottom:10px">── '+names[cat]+' ──</div>';
      CATS[cat].forEach(([cmd2,desc])=>{h+='<div style="margin:4px 0;"><span class="hc">'+esc(cmd2)+'</span><br><span class="hd">&nbsp;&nbsp;'+esc(desc)+'</span></div>';});
      h+='</div>';log(h,'inf');return;
    }
    // show category index
    let h='<div id="help-root" style="border:1px solid var(--border);border-radius:6px;padding:16px;margin:8px 0;max-width:600px;">';
    h+='<div style="color:var(--accent);font-weight:900;font-size:13px;margin-bottom:12px;letter-spacing:2px;">── DREAMCORE v3.0 // HELP ──</div>';
    h+='<div style="color:#555;font-size:11px;margin-bottom:12px;">Type <span style="color:var(--accent)">--help (category)</span> for commands. Click a category to expand.</div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">';
    Object.entries(names).forEach(([key,label])=>{
      const count=CATS[key].length;
      h+=`<div onclick="exec('--help ${key}')" style="cursor:pointer;border:1px solid var(--border);border-radius:4px;padding:8px 12px;transition:border-color .15s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="color:var(--accent);font-weight:900;font-size:11px;">${esc(label)}</div>
        <div style="color:#444;font-size:10px;margin-top:2px;">${count} commands</div>
      </div>`;
    });
    h+='</div>';
    h+='<div style="color:#333;font-size:10px;margin-top:12px;border-top:1px solid var(--border);padding-top:8px;">Natural language works too &#x2014; just talk to KERNEL</div>';
    h+='</div>';
    log(h,'inf');return;
  }
  if(cmd==='--reach'){
    let url=args.join(' ').trim();
    if(!url){log('USAGE: --reach (url) &#x2014; opens a website in a floating window','err');return;}
    if(!/^https?:\/\//i.test(url))url='https://'+url;
    mkWin({title:'&#x2B21; '+url.replace(/^https?:\/\//,'').split('/')[0],w:1020,h:640,type:'iframe',content:url});
    log('Opened: <a href="'+url+'" target="_blank" style="color:var(--accent)">'+esc(url)+'</a> &#x2014; use --endx to close','ok');
    return;
  }
  if(cmd==='--end'){log(`SESSION ENDED: ${S.user}.`,'sys');S.user=null;S.profile=defP();S.history=[];applyTheme(S.profile);updatePrompt();return;}
  if(cmd==='--endx'){closeLastWin();return;}
  if(cmd==='--list'){await listBucket(false);return;}
  if(lo==='.disk'&&args[0]==='-list'){await listBucket(true);return;}
  if(cmd==='--encrypt'){
    if(args[0]==='-usr'&&args[1]==='-reset'){if(!S.profile.encrypted){log('NO ENCRYPTION SET.','err');return;}log('ENTER CURRENT PASSWORD:','sys');$ci.type='password';S.inputMode='enc_verify';return;}
    if(args[0]==='-usr'){if(S.profile.encrypted){log('ALREADY ENCRYPTED. Use --encrypt -usr -reset.','err');return;}log('SET NEW PASSWORD:','sys');$ci.type='password';S.inputMode='enc_set';return;}
    log('USAGE: --encrypt -usr | --encrypt -usr -reset','err');return;
  }
  if(lo.startsWith('root --elevate')){const target=args[1]?.toLowerCase();if(!target){log('USAGE: root --elevate (username)','err');return;}log('ENTER ROOT ID:','sys');$ci.type='password';S.inputMode='root_id';S.inputCtx={target};return;}
  // make/create/generate game
  if(/^(make|create|generate)\s+(multiplayer|mp)\s+game/i.test(input)){
    const desc=input.replace(/^(make|create|generate)\s+(multiplayer|mp)\s+game\s*/i,'').trim()||'a fun multiplayer game';
    await askAI('Build a complete multiplayer HTML5 game: "'+desc+'". All JS+CSS inline, zero external deps, polished dark visuals, Web Audio sounds. MUST include <!-- DC_MULTIPLAYER: true | MODE: both | PLAYERS: 2 | SYNC: input --> as first line inside <html>. Use DC_SYNC/DC_INPUT bridge API. Show lobby while waiting for players. Genuinely fun with 2+ people. Wrap entire html in [GAME_HTML]...[/GAME_HTML].');
    return;
  }
  if(/^(make|create|generate)\s+(solo|single|singleplayer)\s+game/i.test(input)){
    const desc=input.replace(/^(make|create|generate)\s+(solo|single|singleplayer)\s+game\s*/i,'').trim()||'a fun game';
    await askAI('Build a complete single-player HTML5 game: "'+desc+'". Add <!-- DC_MULTIPLAYER: false | MODE: singleplayer --> as first line. All JS+CSS inline, zero external deps, polished dark visuals, Web Audio sounds, HUD, start/gameover screens, controls shown on screen, real gameplay. Take the description literally. Wrap the ENTIRE html in [GAME_HTML]...[/GAME_HTML].');
    return;
  }
  if(/^(make|create|generate)\s+game/i.test(input)){
    const desc=input.replace(/^(make|create|generate)\s+game\s*/i,'').trim()||'a fun arcade game';
    const mpHint=S.currentRoom?' User is in a multiplayer room &#x2014; add DC_MULTIPLAYER header and support multiplayer.':'';
    await askAI('Build a complete self-contained HTML5 game exactly as described: "'+desc+'".'+mpHint+' Requirements: all JS+CSS inline, zero external deps, polished visuals (dark bg, glowing colors), Web Audio API sound, HUD always visible, start/gameover screens, show controls, increasing difficulty. Take the description LITERALLY &#x2014; if they want a specific creature/thing/mechanic, build exactly that. Wrap the ENTIRE html in [GAME_HTML]...[/GAME_HTML]. Do not explain or narrate, just output the game.');
    return;
  }

  // make/draw/generate ascii art
  if(/^(make|draw|generate|create)\s+(ascii|text art)/i.test(input)){
    const desc=input.replace(/^(make|draw|generate|create)\s+(ascii|text art)\s*/i,'').trim()||'a cool design';
    await askAI('Create ASCII art of: "'+desc+'". Use block characters (█▓▒░), box-drawing (┌─┐│└┘), and creative Unicode symbols. Make it detailed and large. Wrap it in [ASCII_ART]...[/ASCII_ART]. Build it, don\'t describe it.');
    return;
  }

  // --save (name) (content or 'last') &#x2014; save something to bucket
  if(cmd==='--save'){
    const fname=args[0];
    if(!fname){log('USAGE: --save (filename)  &#x2014; saves last AI response or game','err');return;}
    const lastAI=S.history.filter(h=>h.role==='model').slice(-1)[0]?.parts?.[0]?.text||'';
    if(!lastAI){log('NOTHING TO SAVE &#x2014; no AI output yet','err');return;}
    const gameMatch=lastAI.match(/\[GAME_HTML\]([\s\S]*?)\[\/GAME_HTML\]/);
    const saveBody=gameMatch?gameMatch[1].trim():lastAI;
    const path=`saves/${S.user.toLowerCase()}/${fname}`;
    log(`SAVING: ${fname}...`,'sys');
    const ok=await sbPut(path,saveBody);
    try{localStorage.setItem('dc3_save_'+S.user.toLowerCase()+'_'+fname,saveBody);}catch{}
    log(ok?`SAVED: ${fname} &#x2192; cloud bucket`:`SAVED: ${fname} &#x2192; local only (cloud offline)`,'ok');
    return;
  }

  // --load (name) &#x2014; load something from bucket
  if(cmd==='--load'){
    const fname=args[0];
    if(!fname){log('USAGE: --load (filename)','err');return;}
    const path=`saves/${S.user.toLowerCase()}/${fname}`;
    log(`FETCHING: ${fname}...`,'sys');
    let data=await sbGet(path);
    if(!data){
      try{data=localStorage.getItem('dc3_save_'+S.user.toLowerCase()+'_'+fname);}catch{}
    }
    if(data){
      // Auto-detect HTML content regardless of filename/extension
      const isHtml=fname.endsWith('.html')||fname.endsWith('.game')||data.trimStart().startsWith('<!DOCTYPE')||data.trimStart().startsWith('<html');
      if(isHtml){
        mkWin({title:'&#x25C8; '+fname,w:940,h:600,type:'game',content:data});
        log(`LAUNCHED: ${fname}`,'ok');
      } else {
        log('<pre style="color:#aaa;font-size:11px;white-space:pre-wrap;margin:8px 0;max-height:300px;overflow:auto;">'+esc(data.slice(0,3000))+'</pre>','inf');
      }
    } else {
      log(`NOT_FOUND: ${fname} &#x2014; not in cloud or local cache`,'err');
    }
    return;
  }

  // --saves &#x2014; list this user's saved files
  if(cmd==='--saves'){
    log(`SCANNING saves/${S.user.toLowerCase()}/...`,'sys');
    const files=await sbList('saves/'+S.user.toLowerCase()+'/');
    const localKeys=Object.keys(localStorage).filter(k=>k.startsWith('dc3_save_'+S.user.toLowerCase()+'_')).map(k=>k.replace('dc3_save_'+S.user.toLowerCase()+'_',''));
    if(!files.length&&!localKeys.length){log('NO SAVED FILES.','sys');return;}
    let html='<table class="lt"><tr><th>FILE</th><th>SIZE</th><th>LOCATION</th></tr>';
    const cloudNames=files.map(f=>{const sz=f.metadata?.size?Math.round(f.metadata.size/1024)+'KB':'?';html+=`<tr><td>${esc(f.name)}</td><td>${sz}</td><td style="color:#00ff88">&#x2601; cloud</td></tr>`;return f.name;});
    localKeys.filter(k=>!cloudNames.includes(k)).forEach(k=>html+=`<tr><td>${esc(k)}</td><td>&#x2014;</td><td style="color:#ffaa00">&#x25C9; local</td></tr>`);
    html+='</table>';
    log(html,'inf');
    return;
  }

  // ── run (filename) ───────────────────────────
  if(cmd==='run'){
    const fname=args[0];
    if(!fname){log('USAGE: run (filename)','err');return;}
    await exec('--load '+fname);
    return;
  }

  // ── --alias ───────────────────────────────────
  if(cmd==='--alias'){
    const sub=args[0]?.toLowerCase();

    if(sub==='set'||sub==='add'){
      // --alias set <shortcut> "<command>"
      const shortcut=args[1]?.toLowerCase();
      if(!shortcut){log('USAGE: --alias set (shortcut) "(command)"','err');return;}
      // everything after the shortcut is the command (strip optional quotes)
      const target=args.slice(2).join(' ').replace(/^["']|["']$/g,'').trim();
      if(!target){log('USAGE: --alias set (shortcut) "(command)"','err');return;}
      S.aliases[shortcut]=target;
      await saveAliases(S.user);
      log(`ALIAS SET: <span style="color:var(--accent)">${esc(shortcut)}</span> &#x2192; ${esc(target)}`,'ok');
      return;
    }

    if(sub==='remove'||sub==='rm'||sub==='delete'||sub==='del'){
      const shortcut=args[1]?.toLowerCase();
      if(!shortcut||!S.aliases[shortcut]){log(`ALIAS NOT FOUND: ${shortcut||'(none)'}` ,'err');return;}
      delete S.aliases[shortcut];
      await saveAliases(S.user);
      log(`ALIAS REMOVED: ${esc(shortcut)}`,'ok');
      return;
    }

    if(sub==='list'||sub==='ls'||!sub){
      const entries=Object.entries(S.aliases);
      if(!entries.length){log('NO ALIASES SET. Use: --alias set (shortcut) "(command)"','sys');return;}
      let h='<table class="ltable"><tr><th>SHORTCUT</th><th>COMMAND</th></tr>';
      entries.forEach(([k,v])=>h+=`<tr><td style="color:var(--accent)">${esc(k)}</td><td>${esc(v)}</td></tr>`);
      h+='</table>';
      log(h,'inf');
      return;
    }

    if(sub==='clear'){
      S.aliases={};
      await saveAliases(S.user);
      log('ALL ALIASES CLEARED.','ok');
      return;
    }

    log('USAGE: --alias set (shortcut) "(command)" | --alias list | --alias remove (shortcut) | --alias clear','err');
    return;
  }

  // ── --pub =library ────────────────────────────
  if(cmd==='--pub'){
    const dest=args[0]?.toLowerCase();
    if(dest!=='=library'){log('USAGE: --pub =library (filename) &#x2014; publish to The Library','err');return;}

    const fname=args[1]||null;
    let body=null, displayName=null;

    if(fname){
      // load from user's saves
      const path=`saves/${S.user.toLowerCase()}/${fname}`;
      log(`LOADING: ${fname}...`,'sys');
      body=await sbGet(path);
      if(!body) try{body=localStorage.getItem('dc3_save_'+S.user.toLowerCase()+'_'+fname);}catch{}
      if(!body){log(`NOT_FOUND: ${fname} in your saves. Use --save (filename) first.`,'err');return;}
      displayName=fname;
    } else {
      // use last AI output
      const lastAI=S.history.filter(h=>h.role==='model').slice(-1)[0]?.parts?.[0]?.text||'';
      if(!lastAI){log('NOTHING TO PUBLISH &#x2014; no AI output yet. Run something first.','err');return;}
      const gm=lastAI.match(/\[GAME_HTML\]([\s\S]*?)\[\/GAME_HTML\]/);
      body=gm?gm[1].trim():lastAI;
      displayName='untitled_'+Date.now();
    }

    // Ask for a library name if publishing last output
    if(!fname){
      log('ENTER A NAME FOR THE LIBRARY ENTRY (no spaces):','sys');
      S.inputMode='pub_name';
      S.inputCtx={body};
      return;
    }

    await publishToLibrary(displayName, body);
    return;
  }

  // ── --library ──────────────────────────────────
  if(cmd==='--library'||input.trim()==='--TheLibrary'){
    const sub=args[0]?.toLowerCase();

    // --library list or just --library
    if(!sub||sub==='list'||sub==='ls'){
      log('SCANNING THE LIBRARY...','sys');
      const files=await sbList('library/');
      if(!files||!files.length){log('THE LIBRARY IS EMPTY. Be the first &#x2014; use --pub =library','sys');return;}
      let h=`<div class="hb"><div style="color:var(--accent);font-weight:900;margin-bottom:8px">── &#x25C8; THE LIBRARY ── PUBLIC COLLECTION ──</div>`;
      files.filter(f=>f.name&&f.name!=='.keep').forEach(f=>{
        const meta=f.metadata||{};
        const sz=meta.size?Math.round(meta.size/1024)+'KB':'?';
        const upd=f.updated_at?f.updated_at.slice(0,10):'?';
        // parse author from filename: author__title
        const parts=f.name.split('__');
        const author=parts.length>1?parts[0]:'unknown';
        const title=parts.length>1?parts.slice(1).join('__'):f.name;
        h+=`<div style="margin:6px 0;display:flex;align-items:center;gap:10px;">
          <span style="color:var(--accent);font-weight:900;min-width:180px">${esc(title)}</span>
          <span style="color:#555;font-size:11px">by ${esc(author)}</span>
          <span style="color:#333;font-size:10px">${sz} &#xB7; ${upd}</span>
          <span style="color:#00ff88;cursor:pointer;font-size:11px" onclick="exec('--library run ${esc(f.name)}')">&#x25B6; RUN</span>
        </div>`;
      });
      h+='</div>';
      log(h,'inf');
      return;
    }

    // --library run (entry)
    if(sub==='run'||sub==='play'||sub==='launch'||sub==='open'){
      const entry=args.slice(1).join(' ').trim();
      if(!entry){log('USAGE: --library run (entry name)','err');return;}
      log(`FETCHING FROM LIBRARY: ${entry}...`,'sys');
      // try exact match first, then search
      let data=await sbGet(`library/${entry}`);
      if(!data){
        // fuzzy: list and find closest
        const files=await sbList('library/');
        const match=files.find(f=>f.name.toLowerCase().includes(entry.toLowerCase()));
        if(match) data=await sbGet(`library/${match.name}`);
      }
      if(!data){log(`NOT FOUND IN LIBRARY: ${entry}`,'err');return;}
      const isHtml=data.trimStart().startsWith('<!DOCTYPE')||data.trimStart().startsWith('<html');
      if(isHtml){
        mkWin({title:'&#x25C8; LIBRARY: '+entry,w:960,h:620,type:'game',content:data});
        log(`LAUNCHED FROM LIBRARY: ${entry}`,'ok');
      } else {
        log('<pre style="color:#aaa;font-size:11px;white-space:pre-wrap;margin:8px 0;max-height:300px;overflow:auto;">'+esc(data.slice(0,3000))+'</pre>','inf');
      }
      return;
    }

    // --library remove (entry) &#x2014; only author or root can remove
    if(sub==='remove'||sub==='rm'||sub==='delete'){
      const entry=args.slice(1).join(' ').trim();
      if(!entry){log('USAGE: --library remove (entry name)','err');return;}
      const author=entry.split('__')[0];
      if(author!==S.user.toLowerCase()&&!S.profile.isRoot){
        log('PERMISSION DENIED &#x2014; you can only remove your own library entries.','err');return;
      }
      const ok=await sbDelete(`library/${entry}`);
      log(ok?`REMOVED FROM LIBRARY: ${entry}`:`REMOVE FAILED: ${entry}`,'ok');
      return;
    }

    log('USAGE: --library | --library run (name) | --library remove (name)','err');
    return;
  }

  // ── /say &#x2014; room chat shortcut ──────────────────
  if(input.startsWith('/say ')){roomSay(input.slice(5).trim());return;}
  if(input.startsWith('/s ')){roomSay(input.slice(3).trim());return;}

  // ── --room ───────────────────────────────────────
  if(cmd==='--room'){
    const sub=args[0]?.toLowerCase();
    if(!sub||sub==='list'){
      log('USAGE: --room (name) &#xB7; --room leave &#xB7; --room invite (user) &#xB7; --room who &#xB7; /say (msg)','inf');
      if(S.currentRoom) log(`CURRENT ROOM: <strong>#${esc(S.currentRoom)}</strong>`,'ok');
      return;
    }
    if(sub==='leave'){leaveRoom();return;}
    if(sub==='invite'){
      const target=args[1];
      const msg=args.slice(2).join(' ').trim();
      if(!target){log('USAGE: --room invite (username) (optional message)','err');return;}
      if(!S.currentRoom){log('JOIN A ROOM FIRST: --room (name)','err');return;}
      inviteToRoom(target,S.currentRoom,msg);return;
    }
    if(sub==='who'){
      if(!_rtChannel||!S.currentRoom){log('NOT IN A ROOM.','sys');return;}
      const state=_rtChannel.presenceState();
      const users=Object.keys(state);
      log(`ROOM <strong>#${esc(S.currentRoom)}</strong> &#x2014; ${users.length} online: ${users.map(u=>esc(u)).join(', ')}`,'inf');
      return;
    }
    joinRoom(args[0]);return;
  }

  // ── --profile ────────────────────────────────────
  if(cmd==='--profile'){
    const sub=args[0]?.toLowerCase();

    if(!sub||sub===S.user?.toLowerCase()){
      log(renderProfile(S.profile, S.user||'GUEST'),'inf');
      return;
    }

    if(sub==='edit'){
      const field=args[1]?.toLowerCase();
      const val=args.slice(2).join(' ').trim();

      if(!field){
        log(`<div class="hb">
<div style="color:var(--accent);font-weight:900;margin-bottom:8px">── PROFILE EDITOR ──</div>
<span class="hc">--profile edit name (display name)</span><br>
<span class="hc">--profile edit bio (your bio)</span><br>
<span class="hc">--profile edit avatar (ascii art, use \\n for newlines)</span><br>
<span class="hc">--profile edit persona (AI name)</span><br>
<span class="hc">--theme font (Courier New|VT323|Share Tech Mono)</span><br>
<span class="hc">--theme scanline (0.0&#x2013;1.0)</span><br>
<span class="hc">--theme flicker (on|off)</span><br>
<span class="hc">--theme cursor (block|bar|underline)</span>
</div>`,'inf');
        return;
      }
      if(field==='name'){S.profile.displayName=val;await saveUser(S.user,S.profile);log(`DISPLAY NAME SET: ${esc(val)}`,'ok');return;}
      if(field==='bio'){S.profile.bio=val;await saveUser(S.user,S.profile);log(`BIO UPDATED.`,'ok');return;}
      if(field==='avatar'){S.profile.avatar=val.replace(/\\n/g,'\n');await saveUser(S.user,S.profile);log(`AVATAR UPDATED.`,'ok');return;}
      if(field==='persona'){S.profile.aiPersona=val;await saveUser(S.user,S.profile);log(`AI PERSONA SET: ${esc(val)}`,'ok');return;}
      log(`UNKNOWN FIELD: ${esc(field)}`,'err');return;
    }

    // view another user's profile
    log(`LOADING PROFILE: ${esc(sub)}...`,'sys');
    const otherP=await loadUser(sub);
    if(!otherP){log(`USER NOT FOUND: ${esc(sub)}`,'err');return;}
    log(renderProfile(otherP,sub),'inf');
    return;
  }

  // ── --theme ──────────────────────────────────────
  if(cmd==='--theme'){
    const field=args[0]?.toLowerCase();
    const val=args.slice(1).join(' ').trim();

    if(field==='font'){
      const fonts={'courier':'Courier New','vt323':'VT323','share':'Share Tech Mono','mono':'monospace'};
      const f=fonts[val.toLowerCase()]||val;
      S.profile.font=f;
      // inject Google Font if needed
      if(f==='VT323'||f==='Share Tech Mono'){
        const lnk=document.createElement('link');
        lnk.rel='stylesheet';
        lnk.href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(f)}&display=swap`;
        document.head.appendChild(lnk);
      }
      applyFullTheme(S.profile);await saveUser(S.user,S.profile);
      log(`FONT SET: ${esc(f)}`,'ok');return;
    }
    if(field==='scanline'){
      const v=Math.max(0,Math.min(1,parseFloat(val)||0.3));
      S.profile.scanlineOpacity=v;applyFullTheme(S.profile);await saveUser(S.user,S.profile);
      log(`SCANLINE INTENSITY: ${v}`,'ok');return;
    }
    if(field==='flicker'){
      S.profile.crtFlicker=val!=='off';applyFullTheme(S.profile);await saveUser(S.user,S.profile);
      log(`CRT FLICKER: ${S.profile.crtFlicker?'ON':'OFF'}`,'ok');return;
    }
    if(field==='cursor'){
      const valid=['block','bar','underline'];
      if(!valid.includes(val)){log('CURSOR: block | bar | underline','err');return;}
      S.profile.cursorStyle=val;applyFullTheme(S.profile);await saveUser(S.user,S.profile);
      log(`CURSOR STYLE: ${val}`,'ok');return;
    }
    if(field==='reset'){
      const d=defP();
      ['font','scanlineOpacity','crtFlicker','cursorStyle','accent','aiColor','logoColor','bgColor','textColor'].forEach(k=>S.profile[k]=d[k]);
      applyFullTheme(S.profile);await saveUser(S.user,S.profile);
      log('THEME RESET TO DEFAULTS.','ok');return;
    }
    log(`<div class="hb">
<div style="color:var(--accent);font-weight:900;margin-bottom:8px">── THEME EDITOR ──</div>
<span class="hc">--theme font (courier|vt323|share|mono)</span><br>
<span class="hc">--theme scanline (0.0&#x2013;1.0)</span><br>
<span class="hc">--theme flicker (on|off)</span><br>
<span class="hc">--theme cursor (block|bar|underline)</span><br>
<span class="hc">--theme reset</span>
</div>`,'inf');return;
  }

  // ── --memory ─────────────────────────────────────
  if(cmd==='--memory'){
    const sub=args[0]?.toLowerCase();
    if(!sub||sub==='list'){
      const mem=S.profile.memory||[];
      if(!mem.length){log('NO MEMORIES. Tell the AI to remember something.','sys');return;}
      let h='<div class="hb"><div style="color:var(--accent);font-weight:900;margin-bottom:6px">── AI MEMORY ──</div>';
      mem.forEach((m,i)=>h+=`<div style="margin:3px 0;"><span style="color:var(--accent)">[${i+1}]</span> ${esc(m)}</div>`);
      h+='<div style="color:#444;font-size:11px;margin-top:6px;">--memory clear &#xB7; --memory remove (n)</div></div>';
      log(h,'inf');return;
    }
    if(sub==='clear'){S.profile.memory=[];saveUser(S.user,S.profile);log('MEMORY CLEARED.','ok');return;}
    if(sub==='remove'){
      const idx=parseInt(args[1])-1;
      if(isNaN(idx)||idx<0||idx>=(S.profile.memory||[]).length){log('INVALID INDEX.','err');return;}
      const removed=S.profile.memory.splice(idx,1)[0];
      saveUser(S.user,S.profile);log(`REMOVED: "${esc(removed)}"`,'ok');return;
    }
    if(sub==='add'){
      const mem=args.slice(1).join(' ').trim();
      if(!mem){log('USAGE: --memory add (text)','err');return;}
      S.profile.memory=S.profile.memory||[];
      S.profile.memory.push(mem);
      saveUser(S.user,S.profile);log(`MEMORY ADDED: "${esc(mem)}"`,'ok');return;
    }
    return;
  }

  // ── --store ──────────────────────────────────────
  if(cmd==='--store'){
    const sub=args[0]?.toLowerCase();
    if(!sub||sub==='list'||sub==='browse'){await browseStore();return;}
    if(sub==='install'){
      const appId=args[1];if(!appId){log('USAGE: --store install (appid)','err');return;}
      await installApp(appId);return;
    }
    if(sub==='uninstall'){
      const appId=args[1];if(!appId){log('USAGE: --store uninstall (appid)','err');return;}
      await uninstallApp(appId);return;
    }
    if(sub==='publish'){
      log(`TO PUBLISH AN APP:\n1. Create a folder: store/(yourappid)/\n2. Upload manifest.json with: name, version, author, description, commands\n3. Upload your app files alongside it\n4. Your app appears in --store automatically`,'inf');return;
    }
    if(sub==='installed'){
      const apps=S.profile.installedApps||[];
      if(!apps.length){log('NO APPS INSTALLED. Try --store to browse.','sys');return;}
      log('INSTALLED APPS: '+apps.map(a=>esc(a)).join(', '),'ok');return;
    }
    await browseStore();return;
  }

  // ── --run (script.dc) ────────────────────────────
  if(cmd==='--run'){
    const fname=args[0];
    if(!fname){log('USAGE: --run (script.dc) &#x2014; run a .dc script','err');return;}
    const path=`saves/${S.user.toLowerCase()}/${fname}`;
    log(`LOADING SCRIPT: ${esc(fname)}...`,'sys');
    let src=await sbGet(path);
    if(!src) try{src=localStorage.getItem('dc3_save_'+S.user.toLowerCase()+'_'+fname);}catch{}
    if(!src){log(`SCRIPT NOT FOUND: ${esc(fname)}`,'err');return;}
    await runScript(src);return;
  }

  // ── PIPES ──────────────────────────────────────
  if(input.includes(' | ')){await execPiped(input);return;}

  // ── /say shorthand (already handled above but also catch here) ──
  if(lo.startsWith('/s ')&&!lo.startsWith('/say')){roomSay(input.slice(3).trim());return;}

  // ── --calc ──────────────────────────────────────
  if(cmd==='--calc'||cmd==='calc'){
    const expr=args.join(' ').trim();
    if(!expr){log('USAGE: --calc (expression) e.g. --calc 2+2*3','err');return;}
    const r=calcEval(expr);
    if(r===null){log('INVALID EXPRESSION.','err');return;}
    log(`${esc(expr)} = <strong style="color:var(--ok);font-size:15px;">${r}</strong>`,'inf');
    clipCopy(String(r),'calc result');
    return;
  }

  // ── --convert ────────────────────────────────────
  if(cmd==='--convert'){
    // --convert 100 km mi
    const val=parseFloat(args[0]),from=args[1],to=args[2];
    if(isNaN(val)||!from||!to){log('USAGE: --convert (value) (from) (to) e.g. --convert 100 km mi','err');return;}
    const r=convert(val,from,to);
    if(r===null){log(`UNKNOWN CONVERSION: ${from} &#x2192; ${to}. Try: km,mi,m,ft,kg,lb,c,f,k,l,ml,gal`,'err');return;}
    log(`${val} ${esc(from)} = <strong style="color:var(--ok);">${typeof r==='number'?r.toFixed(4):r} ${esc(to)}</strong>`,'inf');
    return;
  }

  // ── --weather ────────────────────────────────────
  if(cmd==='--weather'){
    const city=args.join(' ').trim()||'London';
    log(`FETCHING WEATHER: ${esc(city)}...`,'sys');
    const w=await fetchWeather(city);
    if(!w){log('WEATHER UNAVAILABLE &#x2014; check network.','err');return;}
    log(`<div style="margin:8px 0;">
<div style="font-weight:900;color:var(--accent);font-size:14px;">${esc(w.city)}</div>
<div style="font-size:22px;font-weight:900;margin:4px 0;">${w.temp}\u00B0C <span style="font-size:13px;color:#888;">${esc(w.desc)}</span></div>
<div style="color:#666;font-size:11px;">Feels like ${w.feels}\u00B0C &#xB7; Humidity ${w.humidity}% &#xB7; Wind ${w.wind} km/h</div>
</div>`,'inf');
    return;
  }

  // ── --time ───────────────────────────────────────
  if(cmd==='--time'){
    const city=args.join(' ').toLowerCase().trim()||'all';
    const zones=city==='all'?TIMEZONES:Object.fromEntries(Object.entries(TIMEZONES).filter(([k])=>k.includes(city)));
    if(!Object.keys(zones).length){log('CITY NOT FOUND. Try: new york, london, tokyo, sydney, paris...','err');return;}
    let h='<div class="hb">';
    Object.entries(zones).forEach(([name,tz])=>{
      const t=new Date().toLocaleTimeString('en-US',{timeZone:tz,hour12:false,hour:'2-digit',minute:'2-digit'});
      const d=new Date().toLocaleDateString('en-US',{timeZone:tz,weekday:'short',month:'short',day:'numeric'});
      h+=`<div style="display:flex;gap:12px;margin:3px 0;"><span style="color:var(--accent);min-width:120px;font-weight:900;">${t}</span><span style="color:#777;">${d}</span><span style="color:#444;">${name}</span></div>`;
    });
    h+='</div>';
    log(h,'inf');
    return;
  }

  // ── --net ────────────────────────────────────────
  if(cmd==='--net'){
    log('FETCHING NETWORK INFO...','sys');
    const info=await getNetInfo();
    if(!info){log('NETWORK INFO UNAVAILABLE.','err');return;}
    log(`<div class="hb">
<div style="color:var(--accent);font-weight:900;margin-bottom:6px;">── NETWORK INFO ──</div>
<div><span style="color:#555;">IP:</span> ${esc(info.ip||'?')}</div>
<div><span style="color:#555;">LOCATION:</span> ${esc(info.city||'?')}, ${esc(info.region||'?')}, ${esc(info.country_name||'?')}</div>
<div><span style="color:#555;">ISP:</span> ${esc(info.org||'?')}</div>
<div><span style="color:#555;">TIMEZONE:</span> ${esc(info.timezone||'?')}</div>
</div>`,'inf');
    return;
  }

  // ── --quote ──────────────────────────────────────
  if(cmd==='--quote'){
    const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
    log(`<div style="border-left:3px solid var(--accent);padding-left:12px;margin:8px 0;">
<div style="color:var(--text);font-style:italic;">"${esc(q.q)}"</div>
<div style="color:#555;font-size:11px;margin-top:4px;">&#x2014; ${esc(q.a)}</div>
</div>`,'inf');
    return;
  }

  // ── --hack ───────────────────────────────────────
  if(cmd==='--hack'){const target=args.join(' ').toUpperCase()||'MAINFRAME';await hackerMode(target);return;}

  // ── --matrix ─────────────────────────────────────
  if(cmd==='--matrix'){openMatrix();log('ENTERING THE MATRIX...','sys');return;}

  // ── --music / --radio ─────────────────────────────
  if(cmd==='--music'||cmd==='--radio'){openMusicPlayer();return;}

  // ── --pixel ──────────────────────────────────────
  if(cmd==='--pixel'){const sz=parseInt(args[0])||16;openPixelEditor(Math.min(Math.max(sz,8),32));return;}

  // ── --edit ───────────────────────────────────────
  if(cmd==='--edit'){
    const fname=args[0]||'untitled.txt';
    let content='';
    if(args[0]){
      const raw=await sbGet(`saves/${S.user?.toLowerCase()}/${fname}`);
      if(raw) content=raw;
    }
    openCodeEditor(fname,content);
    return;
  }

  // ── --draw ───────────────────────────────────────
  if(cmd==='--draw'){openWhiteboard();return;}

  // ── --md ─────────────────────────────────────────
  if(cmd==='--md'){
    const text=args.join(' ').trim();
    if(!text){log('USAGE: --md (markdown text) or --md last','err');return;}
    const content=text==='last'?(S.history.filter(h=>h.role==='model').slice(-1)[0]?.parts?.[0]?.text||''):text;
    openMarkdownViewer(content);
    return;
  }

  // ── --clip ───────────────────────────────────────
  if(cmd==='--clip'){
    const sub=args[0]?.toLowerCase();
    if(!sub||sub==='list'){
      if(!CLIPS.length){log('CLIPBOARD EMPTY.','sys');return;}
      let h='<div class="hb"><div style="color:var(--accent);font-weight:900;margin-bottom:6px;">── CLIPBOARD ──</div>';
      CLIPS.forEach((c,i)=>h+=`<div style="margin:3px 0;cursor:pointer;" onclick="exec('--clip copy ${i+1}')"><span style="color:var(--accent)">[${i+1}]</span> ${esc(c.label)}</div>`);
      h+='</div>';log(h,'inf');return;
    }
    if(sub==='copy'){const idx=parseInt(args[1])-1;if(isNaN(idx)||!CLIPS[idx]){log('INVALID INDEX.','err');return;}clipCopy(CLIPS[idx].text,CLIPS[idx].label);return;}
    if(sub==='clear'){CLIPS.length=0;log('CLIPBOARD CLEARED.','ok');return;}
    // --clip (text) to add
    const txt=args.slice(0).join(' ');clipCopy(txt);return;
  }

  // ── --todo ───────────────────────────────────────
  if(cmd==='--todo'){
    const sub=args[0]?.toLowerCase();
    if(!sub||sub==='list'){log(renderTodos(),'inf');return;}
    if(sub==='add'){
      const text=args.slice(1).join(' ').replace(/!high|!h/i,'').trim();
      const priority=/(^|\s)(!high|!h)(\s|$)/i.test(args.slice(1).join(' '))?'high':'normal';
      const due=args.find(a=>/^\d{4}-\d{2}-\d{2}$/.test(a))||null;
      const todos=getTodos();todos.push({text,done:false,priority,due,created:Date.now()});saveTodos(todos);
      log(`TODO ADDED: ${esc(text)}${priority==='high'?' [HIGH]':''}${due?' due:'+due:''}`, 'ok');return;
    }
    if(sub==='done'){const n=parseInt(args[1])-1;const t=getTodos();if(!t[n]){log('INVALID.','err');return;}t[n].done=!t[n].done;saveTodos(t);log(`TODO ${t[n].done?'DONE':'UNDONE'}: ${esc(t[n].text)}`,'ok');return;}
    if(sub==='remove'||sub==='rm'){const n=parseInt(args[1])-1;const t=getTodos();if(!t[n]){log('INVALID.','err');return;}const r=t.splice(n,1)[0];saveTodos(t);log(`TODO REMOVED: ${esc(r.text)}`,'ok');return;}
    if(sub==='clear'){saveTodos([]);log('ALL TODOS CLEARED.','ok');return;}
    return;
  }

  // ── --pomo ───────────────────────────────────────
  if(cmd==='--pomo'){
    const sub=args[0]?.toLowerCase();
    if(sub==='stop'){if(_pomoTimer){clearInterval(_pomoTimer);_pomoTimer=null;log('POMODORO STOPPED.','ok');}else log('NO POMODORO RUNNING.','sys');return;}
    if(sub==='status'){log(_pomoTimer?`POMODORO: ${Math.floor(_pomoLeft/60)}m ${_pomoLeft%60}s remaining`:'NO POMODORO RUNNING.','inf');return;}
    const mins=parseInt(args[0])||25;startPomo(mins);return;
  }

  // ── --note ───────────────────────────────────────
  if(cmd==='--note'){
    const sub=args[0]?.toLowerCase();
    const notes=getNotes();
    if(!sub||sub==='list'){
      const keys=Object.keys(notes);
      if(!keys.length){log('NO NOTES. --note set (name) (content)','sys');return;}
      let h='<div class="hb"><div style="color:var(--accent);font-weight:900;margin-bottom:6px;">── NOTES ──</div>';
      keys.forEach(k=>h+=`<div style="margin:3px 0;cursor:pointer;" onclick="exec('--note get ${k}')"><span style="color:var(--accent)">${esc(k)}</span> <span style="color:#444;font-size:11px;">${esc((notes[k]||'').slice(0,60))}...</span></div>`);
      h+='</div>';log(h,'inf');return;
    }
    if(sub==='set'||sub==='add'){const name=args[1];const content=args.slice(2).join(' ');if(!name){log('USAGE: --note set (name) (content)','err');return;}notes[name]=content;saveNotes(notes);log(`NOTE SAVED: ${esc(name)}`,'ok');return;}
    if(sub==='get'){const name=args[1];if(!notes[name]){log(`NOTE NOT FOUND: ${esc(name||'')}`, 'err');return;}log(`<div class="hb"><div style="color:var(--accent);font-weight:900;">${esc(name)}</div><div style="margin-top:6px;">${esc(notes[name])}</div></div>`,'inf');return;}
    if(sub==='remove'||sub==='rm'){const name=args[1];delete notes[name];saveNotes(notes);log(`NOTE REMOVED: ${esc(name||'')}`,'ok');return;}
    if(sub==='edit'){const name=args[1];openCodeEditor(name+'.note',notes[name]||'');return;}
    return;
  }

  // ── --bm (bookmarks) ─────────────────────────────
  if(cmd==='--bm'){
    const sub=args[0]?.toLowerCase();
    const bms=getBookmarks();
    if(!sub||sub==='list'){
      if(!bms.length){log('NO BOOKMARKS. --bm add (url) (label)','sys');return;}
      let h='<div class="hb"><div style="color:var(--accent);font-weight:900;margin-bottom:6px;">── BOOKMARKS ──</div>';
      bms.forEach((b,i)=>h+=`<div style="margin:3px 0;display:flex;gap:10px;"><span style="color:var(--accent)">[${i+1}]</span><span style="cursor:pointer;color:#888;" onclick="exec('--reach ${b.url}')">${esc(b.label||b.url)}</span><span style="color:#444;font-size:10px;">${esc(b.url)}</span></div>`);
      h+='</div>';log(h,'inf');return;
    }
    if(sub==='add'){const url=args[1];const label=args.slice(2).join(' ')||url;if(!url){log('USAGE: --bm add (url) (label)','err');return;}bms.push({url,label,added:Date.now()});saveBookmarks(bms);log(`BOOKMARK ADDED: ${esc(label)}`,'ok');return;}
    if(sub==='open'){const n=parseInt(args[1])-1;if(!bms[n]){log('INVALID.','err');return;}await exec('--reach '+bms[n].url);return;}
    if(sub==='remove'||sub==='rm'){const n=parseInt(args[1])-1;if(!bms[n]){log('INVALID.','err');return;}const r=bms.splice(n,1)[0];saveBookmarks(bms);log(`BOOKMARK REMOVED: ${esc(r.label)}`,'ok');return;}
    return;
  }

  // ── --journal ─────────────────────────────────────
  if(cmd==='--journal'){
    const sub=args[0]?.toLowerCase();
    const journal=getJournal();
    if(!sub||sub==='new'||sub==='write'){
      const entry=sub==='write'?args.slice(1).join(' '):(sub==='new'?args.slice(1).join(' '):args.join(' '));
      if(!entry&&sub){log('USAGE: --journal write (your entry)','err');return;}
      if(!entry){openCodeEditor(`journal_${new Date().toISOString().slice(0,10)}.txt`,'');return;}
      journal.unshift({text:entry,date:new Date().toISOString(),mood:null});saveJournal(journal);
      log(`JOURNAL ENTRY SAVED. ${journal.length} total entries.`,'ok');return;
    }
    if(sub==='list'){
      if(!journal.length){log('NO JOURNAL ENTRIES YET.','sys');return;}
      let h='<div class="hb"><div style="color:var(--accent);font-weight:900;margin-bottom:6px;">── JOURNAL ──</div>';
      journal.slice(0,10).forEach((e,i)=>h+=`<div style="margin:4px 0;"><span style="color:#555;font-size:10px;">${e.date.slice(0,10)}</span> ${esc(e.text.slice(0,80))}${e.text.length>80?'...':''}</div>`);

/* ── PHASE 3: .DC SCRIPTING ENGINE ── */
async function runScript(src){
  const lines=src.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  const vars={};
  log(`RUNNING SCRIPT (${lines.length} lines)...`,'sys');
  for(let i=0;i<lines.length;i++){
    let line=lines[i];
    // variable set: SET name value
    if(/^SET\s+/i.test(line)){
      const m=line.match(/^SET\s+(\w+)\s+(.+)/i);
      if(m) vars[m[1]]=m[2];
      continue;
    }
    // variable substitution
    line=line.replace(/\$\{(\w+)\}/g,(_,k)=>vars[k]||'');
    // WAIT ms
    if(/^WAIT\s+\d+/i.test(line)){
      await sleep(parseInt(line.split(/\s+/)[1])||500);
      continue;
    }
    // PRINT message
    if(/^PRINT\s+/i.test(line)){
      log(esc(line.slice(6).trim()),'inf');
      continue;
    }
    // IF condition THEN cmd
    if(/^IF\s+/i.test(line)){
      const m=line.match(/^IF\s+(.+)\s+THEN\s+(.+)/i);
      if(m){
        try{ if(eval(m[1].replace(/\$\{(\w+)\}/g,(_,k)=>JSON.stringify(vars[k]||'')))) await exec(m[2]); }
        catch{}
      }
      continue;
    }
    // otherwise treat as a terminal command
    await exec(line);
    await sleep(80);
  }
  log('SCRIPT COMPLETE.','ok');
}

/* ── PHASE 4: APP STORE ── */
async function loadAppManifest(appId){
  const raw=await sbFetch(`store/${appId}/manifest.json`);
  if(!raw) return null;
  try{return JSON.parse(raw);}catch{return null;}
}
async function installApp(appId){
  const manifest=await loadAppManifest(appId);
  if(!manifest){log(`APP NOT FOUND: ${appId}`,'err');return;}
  if((S.profile.installedApps||[]).includes(appId)){log(`ALREADY INSTALLED: ${appId}`,'sys');return;}
  // register app commands
  if(manifest.commands) for(const[cmd,handler] of Object.entries(manifest.commands))
    S.aliases[cmd]=handler;
  S.profile.installedApps=[...(S.profile.installedApps||[]),appId];
  S.profile.stats=S.profile.stats||{};
  saveUser(S.user,S.profile);
  log(`INSTALLED: ${manifest.name||appId} v${manifest.version||'1.0'} &#x2014; ${manifest.description||''}`, 'ok');
  if(manifest.onInstall) await exec(manifest.onInstall);
}
async function uninstallApp(appId){
  const manifest=await loadAppManifest(appId);
  S.profile.installedApps=(S.profile.installedApps||[]).filter(a=>a!==appId);
  if(manifest?.commands) for(const cmd of Object.keys(manifest.commands))
    if(S.aliases[cmd]) delete S.aliases[cmd];
  saveUser(S.user,S.profile);
  log(`UNINSTALLED: ${appId}`,'ok');
}

/* ── Send an invite to a user ── */
function inviteToRoom(targetUser,roomName,message){
  if(!S.user){log('NOT LOGGED IN.','err');return;}
  if(!roomName){log('JOIN A ROOM FIRST: --room (name)','err');return;}
  _ensureSB2(()=>{
    const targetCh=window._sb2.channel('inbox:'+targetUser.toLowerCase());
    targetCh.subscribe(status=>{
      if(status==='SUBSCRIBED'){
        targetCh.send({
          type:'broadcast',
          event:'invite',
          payload:{from:S.user,room:roomName,msg:message||''}
        }).then(()=>{
          log(`INVITE SENT to <span style="color:var(--accent);font-weight:900;">${esc(targetUser)}</span> for room <strong>#${esc(roomName)}</strong>`,'ok');
          notify(`Invite sent to ${esc(targetUser)}`,'ok',2500);
          // send response notification back when they accept &#x2014; listen on our own inbox
          // acceptance is shown via presence sync in the room itself
        });
        // unsubscribe the temp channel after sending
        setTimeout(()=>targetCh.unsubscribe(),3000);
      }
    });
  });
}

function joinRoom(roomName){
  _ensureSB2(()=>_joinRoom(roomName));
}

function _joinRoom(roomName){
  if(!window._sb2){log('REALTIME: Supabase not available.','err');return;}
  if(_rtChannel){_rtChannel.unsubscribe();_rtChannel=null;}
  S.currentRoom=roomName;
  _rtChannel=window._sb2.channel('room:'+roomName,{config:{presence:{key:S.user||'GUEST'}}});
  _rtChannel
    .on('broadcast',{event:'msg'},({payload})=>{
      if(payload.user!==S.user){
        const gm=/^GROUP CALL: (.+)$/.exec(payload.text||'');
        if(gm){
          log(`<span style="color:var(--accent)">${esc(payload.user)}</span><span style="color:#555"> started a group call in #${esc(roomName)} &#x2014; </span><span style="color:#00FF41;cursor:pointer;text-decoration:underline;" onclick="joinGroupCall('${esc(gm[1])}')">JOIN CALL</span>`,'inf');
        } else {
          log(`<span style="color:var(--accent)">${esc(payload.user)}</span><span style="color:#555"> in #${esc(roomName)}:</span> ${esc(payload.text)}`,'inf');
        }
      }
    })
    .on('broadcast',{event:'cmd'},({payload})=>{
      if(payload.user!==S.user)
        log(`<span style="color:#555">${esc(payload.user)} ran:</span> ${esc(payload.cmd)}`,'sys');
    })
    .on('broadcast',{event:'invite'},({payload})=>{
      // someone in the room sent an invite to someone else &#x2014; just show who
      if(payload.user!==S.user)
        log(`${esc(payload.user)} invited ${esc(payload.target)} to the room`,'sys');
    })
    .on('presence',{event:'sync'},()=>{
      const state=_rtChannel.presenceState();
      const users=Object.keys(state);
      log(`ROOM #${esc(roomName)} &#x2014; online: ${users.map(u=>esc(u)).join(', ')}`,'sys');
      updateStatusBar();
    })
    .on('presence',{event:'join'},({key})=>{
      if(key!==S.user) log(`&#x2192; ${esc(key)} joined #${esc(roomName)}`,'ok');
    })
    .on('presence',{event:'leave'},({key})=>{
      if(key!==S.user) log(`&#x2190; ${esc(key)} left #${esc(roomName)}`,'sys');
    })
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){
        _rtChannel.track({user:S.user,joinedAt:new Date().toISOString()});
        log(`JOINED ROOM: <strong>#${esc(roomName)}</strong> &#x2014; /say (msg) to chat &#xB7; --room invite (user) to invite`,'ok');
        updateStatusBar();
      }
    });
}

function leaveRoom(){
  if(!_rtChannel){log('NOT IN A ROOM.','sys');return;}
  _rtChannel.unsubscribe();_rtChannel=null;S.currentRoom=null;
  log('LEFT ROOM.','sys');
  updateStatusBar();
}

function roomSay(text){
  if(!_rtChannel){log('NOT IN A ROOM. Use --room (name) to join.','err');return;}
  _rtChannel.send({type:'broadcast',event:'msg',payload:{user:S.user,text}});
  log(`<span style="color:var(--accent)">${esc(S.user)}</span><span style="color:#555"> in #${esc(S.currentRoom)}:</span> ${esc(text)}`,'inf');
}

function calcEval(expr){

/* ══════════════════════════════════════════════
   UNIT CONVERTER  (--convert)
══════════════════════════════════════════════ */
const UNITS={
  km:{mi:0.621371,m:1000,ft:3280.84,cm:100000},
  mi:{km:1.60934,m:1609.34,ft:5280,cm:160934},
  m:{km:0.001,mi:0.000621,ft:3.28084,cm:100},
  kg:{lb:2.20462,oz:35.274,g:1000},
  lb:{kg:0.453592,oz:16,g:453.592},
  c:{f:(v)=>v*9/5+32,k:(v)=>v+273.15},
  f:{c:(v)=>(v-32)*5/9,k:(v)=>(v-32)*5/9+273.15},
  k:{c:(v)=>v-273.15,f:(v)=>(v-273.15)*9/5+32},
  l:{ml:1000,gal:0.264172,fl_oz:33.814},
  ml:{l:0.001,gal:0.000264,fl_oz:0.033814},
  gal:{l:3.78541,ml:3785.41,fl_oz:128},
};
function convert(val,from,to){
  const f=from.toLowerCase(),t=to.toLowerCase();
  if(!UNITS[f]) return null;
  const conv=UNITS[f][t];
  if(typeof conv==='function') return conv(val);
  if(typeof conv==='number') return val*conv;
  return null;
}

/* ══════════════════════════════════════════════
   MARKDOWN RENDERER  (--md)
══════════════════════════════════════════════ */
function renderMd(text){
  return text
    .replace(/^### (.+)$/gm,'<div style="color:var(--accent);font-weight:900;margin:8px 0 4px;font-size:13px;">$1</div>')
    .replace(/^## (.+)$/gm,'<div style="color:var(--text);font-weight:900;margin:10px 0 4px;font-size:14px;">$1</div>')
    .replace(/^# (.+)$/gm,'<div style="color:var(--logo);font-weight:900;margin:12px 0 4px;font-size:16px;">$1</div>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code style="background:#1a1a1a;padding:1px 4px;border-radius:2px;color:var(--ok);">$1</code>')
    .replace(/^- (.+)$/gm,'<div style="margin:2px 0;">&#xB7; $1</div>')
    .replace(/^\d+\. (.+)$/gm,'<div style="margin:2px 0;">$1</div>')
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" style="color:var(--accent);">$1</a>')
    .replace(/^---$/gm,'<hr style="border:none;border-top:1px solid var(--border);margin:8px 0;">')
    .replace(/\n/g,'<br>');
}

/* ══════════════════════════════════════════════
   DIFF TOOL  (--diff)
══════════════════════════════════════════════ */
function diffText(a,b){
  const al=a.split('\n'), bl=b.split('\n');
  let out='';
  const max=Math.max(al.length,bl.length);
  for(let i=0;i<max;i++){
    if(al[i]===bl[i]) out+=`<div class="diff-ctx"> ${esc(al[i]||'')}</div>`;
    else{
      if(al[i]!==undefined) out+=`<div class="diff-rem">- ${esc(al[i])}</div>`;
      if(bl[i]!==undefined) out+=`<div class="diff-add">+ ${esc(bl[i])}</div>`;
    }
  }
  return out;
}

/* ══════════════════════════════════════════════
   WEATHER  (--weather)
══════════════════════════════════════════════ */
async function fetchWeather(city){
  try{
    const r=await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
    if(!r.ok) return null;
    const d=await r.json();
    const cur=d.current_condition?.[0];
    if(!cur) return null;
    return{
      temp:cur.temp_C,
      feels:cur.FeelsLikeC,
      desc:cur.weatherDesc?.[0]?.value||'',
      humidity:cur.humidity,
      wind:cur.windspeedKmph,
      city:d.nearest_area?.[0]?.areaName?.[0]?.value||city
    };
  }catch{return null;}
}

const BANNER_CHARS={
  A:['  /\\  ','/ \\\\  ','/__\\ ','/__\\ '],B:['|&#x2013; ','|&#x2013; ','|__ '],
};
function bigText(text){
  const rows=5;let lines=Array(rows).fill('');
  for(const ch of text.toUpperCase()){
    const w=10,sp=1;
    for(let r=0;r<rows;r++){

}

function openWhiteboard(){
  const html=`<!DOCTYPE html><html><head><style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d0d0d;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    #toolbar{background:#131313;padding:6px 10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #222;flex-wrap:wrap;}

    .tool-btn.active{background:#333;}
    input[type=color]{width:24px;height:24px;padding:0;border:1px solid #333;cursor:pointer;background:none;}
    input[type=range]{width:60px;}
  </style></head><body>
    <div id="toolbar">
      <button class="tool-btn active" id="t-pen" onclick="setTool('pen',this)">PEN</button>
      <button class="tool-btn" id="t-line" onclick="setTool('line',this)">LINE</button>
      <button class="tool-btn" id="t-rect" onclick="setTool('rect',this)">RECT</button>
      <button class="tool-btn" id="t-circle" onclick="setTool('circle',this)">CIRCLE</button>
      <button class="tool-btn" id="t-erase" onclick="setTool('erase',this)">ERASE</button>
      <button class="tool-btn" id="t-fill" onclick="setTool('fill',this)">FILL</button>
      <input type="color" id="col" value="#00ff88" title="Color">
      <input type="range" id="sz" min="1" max="40" value="3" title="Size">
      <button class="tool-btn" onclick="undo()">UNDO</button>
      <button class="tool-btn" onclick="clearBoard()">CLEAR</button>
      <button class="tool-btn" onclick="saveBoard()">SAVE PNG</button>
    </div>
    <canvas id="c"></canvas>
    <script>
      const c=document.getElementById('c'),ctx=c.getContext('2d');
      let tool='pen',drawing=false,lx=0,ly=0,snap=null,history=[];
      function resize(){c.width=c.offsetWidth;c.height=c.offsetHeight;}
      resize();window.addEventListener('resize',resize);
      ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,c.width,c.height);
      function setTool(t,btn){tool=t;document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
      function pt(e){const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
      function down(e){e.preventDefault();drawing=true;const p=pt(e);lx=p.x;ly=p.y;if(tool!=='pen'&&tool!=='erase'){snap=ctx.getImageData(0,0,c.width,c.height);}if(tool==='pen'||tool==='erase'){ctx.beginPath();ctx.moveTo(lx,ly);}if(tool==='fill')floodFill(lx,ly);}
      function move(e){e.preventDefault();if(!drawing)return;const p=pt(e);const col=document.getElementById('col').value;const sz=parseInt(document.getElementById('sz').value);ctx.strokeStyle=tool==='erase'?'#0d0d0d':col;ctx.fillStyle=col;ctx.lineWidth=sz;ctx.lineCap='round';
        if(tool==='pen'||tool==='erase'){ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);}
        else if(snap){ctx.putImageData(snap,0,0);ctx.beginPath();
          if(tool==='line'){ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();}
          else if(tool==='rect'){ctx.strokeRect(lx,ly,p.x-lx,p.y-ly);}
          else if(tool==='circle'){ctx.ellipse((lx+p.x)/2,(ly+p.y)/2,Math.abs(p.x-lx)/2,Math.abs(p.y-ly)/2,0,0,Math.PI*2);ctx.stroke();}
        }
      }
      function up(e){if(!drawing)return;drawing=false;history.push(ctx.getImageData(0,0,c.width,c.height));if(history.length>20)history.shift();}
      function undo(){if(history.length>0){ctx.putImageData(history.pop(),0,0);}}
      function clearBoard(){ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,c.width,c.height);history=[];}
      function saveBoard(){const a=document.createElement('a');a.href=c.toDataURL();a.download='dreamcore_draw_'+Date.now()+'.png';a.click();}
      function floodFill(x,y){/* simple flood fill placeholder */}
      c.addEventListener('mousedown',down);c.addEventListener('mousemove',move);c.addEventListener('mouseup',up);
      c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',up);
    <\/script>
  </body></html>`;
  mkWin({title:'&#x25C8; WHITEBOARD',w:860,h:560,content:html,type:'game'});
}

function calcStreak(log){
  if(!log||!log.length) return 0;
  const sorted=[...new Set(log)].sort().reverse();
  let streak=0,d=new Date();
  for(const entry of sorted){
    const ed=entry.slice(0,10);const dd=d.toISOString().slice(0,10);
    if(ed===dd){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}

let _idleTimer=null,_ssActive=false;
/* ═══════════════════════════════════════════
   GLOBAL DRAG-DROP &#x2192; ENCRYPTED FOLDER
   If an encrypted folder is open and unlocked,
   dragging a file onto the terminal adds it.
═══════════════════════════════════════════ */
document.addEventListener('dragover', e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});
document.addEventListener('drop', e=>{
  e.preventDefault();
  const files=Array.from(e.dataTransfer.files);
  if(!files.length) return;
  // Find any unlocked folders
  const unlocked=Object.entries(_cdFolders).filter(([n,v])=>v.unlocked).map(([n])=>n);
  if(!S.user){log('Login required to add files.','err');return;}
  if(!unlocked.length){
    // No open folder &#x2014; offer to add to saves
    if(files.length===1){
      const file=files[0];
      const reader=new FileReader();
      reader.onload=ev=>{
        const path='saves/'+S.user.toLowerCase()+'/'+file.name;
        sbWrite(path,ev.target.result);
        try{localStorage.setItem('dc3_save_'+S.user.toLowerCase()+'_'+file.name,ev.target.result);}catch{}
        log('Saved "'+esc(file.name)+'" to your disk. Use --load '+esc(file.name)+' to open it.','ok');
      };
      reader.readAsText(file);
    } else {
      log(files.length+' files dropped. Open an encrypted folder first (cd| foldername) to add files there.','sys');
    }
    return;
  }
  // Add to most recently opened unlocked folder
  const targetFolder=unlocked[unlocked.length-1];
  const key='cdfolder_'+S.user.toLowerCase()+'_'+targetFolder.toLowerCase().replace(/[^a-z0-9_]/g,'_');
  let done=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const ext=file.name.split('.').pop().toLowerCase();
      const type=['jpg','jpeg','png','gif','webp','svg'].includes(ext)?'image':
                 ['mp3','ogg','wav','m4a'].includes(ext)?'audio':
                 ['mp4','webm','mov'].includes(ext)?'video':
                 ext==='json'?'json':'file';
      const items=lsGet(key+'_items')||[];
      items.push({name:file.name,type,data:ev.target.result,size:Math.round(file.size/1024)+'KB',added:Date.now()});
      lsSet(key+'_items',items);
      done++;
      if(done===files.length) log(done+' file(s) added to encrypted folder "'+esc(targetFolder)+'".','ok');
    };
    reader.readAsDataURL(file);
  });
});

/* ══════════════════════════════════════════════
   MULTIPLAYER GAME ENGINE
   Parses DC_MULTIPLAYER header, injects sync
   bridge into game iframes via postMessage
══════════════════════════════════════════════ */

// Active multiplayer game sessions: { winId: { channel, isHost, playerIndex, playerCount, mode, sync } }
const _mpSessions = {};

function parseMpHeader(html) {
  const m = html.match(/<!--\s*DC_MULTIPLAYER:\s*(true|false)[^>]*?MODE:\s*(\w+)[^>]*?PLAYERS:\s*(\d+)[^>]*?SYNC:\s*(\w+)\s*-->/i);
  if (!m) return null;
  return {
    enabled: m[1].toLowerCase() === 'true',
    mode: m[2].toLowerCase(),    // singleplayer | multiplayer | both
    maxPlayers: parseInt(m[3]),
    sync: m[4].toLowerCase()     // state | input
  };
}

// Inject the DC bridge API into game HTML before it loads
function injectMpBridge(html, winId, isHost, playerIndex, playerCount, syncMode) {
  const bridge = `
<script>
// ── DreamCore Multiplayer Bridge ──
window.DC_IS_HOST = ${isHost};
window.DC_PLAYER_INDEX = ${playerIndex};
window.DC_PLAYER_COUNT = ${playerCount};
window.DC_WIN_ID = '${winId}';

// Called by game to broadcast state (host only for state sync, any player for input sync)
window.DC_SYNC = function(stateObj) {
  window.parent.postMessage({ type: 'DC_GAME_SYNC', winId: '${winId}', payload: stateObj }, '*');
};
window.DC_INPUT = function(inputObj) {
  window.parent.postMessage({ type: 'DC_GAME_INPUT', winId: '${winId}', payload: inputObj, playerIndex: ${playerIndex} }, '*');
};

// Terminal will call these when remote data arrives
window.DC_ON_SYNC = function(state) {}; // override in game
window.DC_ON_INPUT = function(playerIndex, input) {}; // override in game
window.DC_ON_PLAYER_JOIN = function(playerIndex, count) {}; // override in game
window.DC_ON_PLAYER_LEAVE = function(playerIndex, count) {}; // override in game

// Listen for messages from terminal (incoming remote sync/input)
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'DC_REMOTE_SYNC' && e.data.winId === '${winId}') {
    if (typeof window.DC_ON_SYNC === 'function') window.DC_ON_SYNC(e.data.payload);
  }
  if (e.data.type === 'DC_REMOTE_INPUT' && e.data.winId === '${winId}') {
    if (typeof window.DC_ON_INPUT === 'function') window.DC_ON_INPUT(e.data.playerIndex, e.data.payload);
  }
  if (e.data.type === 'DC_PLAYER_JOIN' && e.data.winId === '${winId}') {
    window.DC_PLAYER_COUNT = e.data.count;
    if (typeof window.DC_ON_PLAYER_JOIN === 'function') window.DC_ON_PLAYER_JOIN(e.data.playerIndex, e.data.count);
  }
  if (e.data.type === 'DC_PLAYER_LEAVE' && e.data.winId === '${winId}') {
    window.DC_PLAYER_COUNT = e.data.count;
    if (typeof window.DC_ON_PLAYER_LEAVE === 'function') window.DC_ON_PLAYER_LEAVE(e.data.playerIndex, e.data.count);
  }
});

console.log('[DreamCore MP] Bridge active &#x2014; Host:', ${isHost}, '| Player:', ${playerIndex}, '/', ${playerCount});
<\/script>`;

  // inject right after <html> opening tag
  return html.replace(/(<html[^>]*>)/i, '$1\n' + bridge);
}

// Terminal listens for messages from game iframes
window.addEventListener('message', function(e) {
  if (!e.data || !e.data.winId) return;
  const sess = _mpSessions[e.data.winId];
  if (!sess) return;

  if (e.data.type === 'DC_GAME_SYNC') {
    // Broadcast state to all other players in the room via Realtime
    if (sess.channel) {
      sess.channel.send({
        type: 'broadcast', event: 'game_sync',
        payload: { winId: e.data.winId, state: e.data.payload, from: S.user }
      });
    }
  }
  if (e.data.type === 'DC_GAME_INPUT') {
    if (sess.channel) {
      sess.channel.send({
        type: 'broadcast', event: 'game_input',
        payload: { winId: e.data.winId, input: e.data.payload, playerIndex: e.data.playerIndex, from: S.user }
      });
    }
  }
});

// Launch a multiplayer game session
function launchMpGame(title, html, mpInfo) {
  if (!S.currentRoom) {
    log('JOIN A ROOM FIRST to play multiplayer: --room (name)', 'err');
    return;
  }
  if (!window._sb2) {
    log('REALTIME NOT READY. Try again in a moment.', 'err');
    return;
  }

  const winId = 'mpgame_' + Date.now();
  const isHost = true; // launcher is always host
  const playerIndex = 0;

  // Inject bridge into game HTML
  const injected = injectMpBridge(html, winId, isHost, playerIndex, 1, mpInfo.sync);

  // Open game window
  const { body } = mkWin({ title: '&#x25C8; ' + title + ' [HOST]', w: 960, h: 620, type: 'html' });
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:100%;height:100%;border:none;background:#000;';
  iframe.srcdoc = injected;
  iframe.sandbox = 'allow-scripts allow-same-origin';
  body.appendChild(iframe);

  // Create a dedicated game channel in the current room
  const gameChannel = window._sb2.channel('game:' + S.currentRoom + ':' + winId);
  const session = { channel: gameChannel, isHost, playerIndex, playerCount: 1, mode: mpInfo.mode, sync: mpInfo.sync, iframe, players: [S.user] };
  _mpSessions[winId] = session;

  gameChannel
    .on('broadcast', { event: 'game_join' }, ({ payload }) => {
      if (payload.user === S.user) return;
      session.players.push(payload.user);
      session.playerCount = session.players.length;
      log(`PLAYER JOINED GAME: <span style="color:var(--accent)">${esc(payload.user)}</span> (Player ${session.playerCount})`, 'ok');
      notify(`${esc(payload.user)} joined the game!`, 'ok', 3000);
      // Tell the host's iframe
      iframe.contentWindow?.postMessage({ type: 'DC_PLAYER_JOIN', winId, playerIndex: session.playerCount - 1, count: session.playerCount }, '*');
      // Tell the new player their index via the channel
      gameChannel.send({ type: 'broadcast', event: 'game_assign', payload: { target: payload.user, playerIndex: session.playerCount - 1, playerCount: session.playerCount, winId } });
    })
    .on('broadcast', { event: 'game_sync' }, ({ payload }) => {
      if (payload.from === S.user) return;
      iframe.contentWindow?.postMessage({ type: 'DC_REMOTE_SYNC', winId, payload: payload.state }, '*');
    })
    .on('broadcast', { event: 'game_input' }, ({ payload }) => {
      if (payload.from === S.user) return;
      iframe.contentWindow?.postMessage({ type: 'DC_REMOTE_INPUT', winId, playerIndex: payload.playerIndex, payload: payload.input }, '*');
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') {
        log(`MULTIPLAYER GAME STARTED: <strong>${esc(title)}</strong> in #${esc(S.currentRoom)} &#x2014; share with: <span class="hc">--game join ${winId}</span>`, 'ok');
        notify('Game hosted! Share --game join ' + winId, 'ok', 5000);
      }
    });
}

// Join an existing multiplayer game session
function joinMpGame(winId) {
  if (!S.currentRoom) { log('JOIN A ROOM FIRST: --room (name)', 'err'); return; }
  if (!window._sb2) { log('REALTIME NOT READY.', 'err'); return; }

  const gameChannel = window._sb2.channel('game:' + S.currentRoom + ':' + winId);
  let playerIndex = -1;
  let playerCount = 1;
  let iframe = null;

  const session = { channel: gameChannel, isHost: false, playerIndex: -1, playerCount: 1, sync: 'state', players: [] };
  _mpSessions[winId] = session;

  gameChannel
    .on('broadcast', { event: 'game_assign' }, ({ payload }) => {
      if (payload.target !== S.user) return;
      playerIndex = payload.playerIndex;
      playerCount = payload.playerCount;
      session.playerIndex = playerIndex;
      session.playerCount = playerCount;
      log(`ASSIGNED: Player ${playerIndex + 1} of ${playerCount}`, 'sys');
      // Now open window &#x2014; we need the game HTML from the host
      // Request it
      gameChannel.send({ type: 'broadcast', event: 'game_html_req', payload: { user: S.user } });
    })
    .on('broadcast', { event: 'game_html_res' }, ({ payload }) => {
      if (payload.target !== S.user) return;
      const injected = injectMpBridge(payload.html, winId, false, playerIndex, playerCount, payload.sync || 'state');
      const { body } = mkWin({ title: '&#x25C8; ' + (payload.title || 'GAME') + ' [P' + (playerIndex + 1) + ']', w: 960, h: 620, type: 'html' });
      iframe = document.createElement('iframe');
      iframe.style.cssText = 'width:100%;height:100%;border:none;background:#000;';
      iframe.srcdoc = injected;
      iframe.sandbox = 'allow-scripts allow-same-origin';
      body.appendChild(iframe);
      session.iframe = iframe;
      log('GAME LOADED. You are <strong>Player ' + (playerIndex + 1) + '</strong>.', 'ok');
    })
    .on('broadcast', { event: 'game_sync' }, ({ payload }) => {
      if (payload.from === S.user || !iframe) return;
      iframe.contentWindow?.postMessage({ type: 'DC_REMOTE_SYNC', winId, payload: payload.state }, '*');
    })
    .on('broadcast', { event: 'game_input' }, ({ payload }) => {
      if (payload.from === S.user || !iframe) return;
      iframe.contentWindow?.postMessage({ type: 'DC_REMOTE_INPUT', winId, playerIndex: payload.playerIndex, payload: payload.input }, '*');
    })
    .on('broadcast', { event: 'game_html_req' }, ({ payload }) => {
      // if we are host, send HTML to requester
      // (handled in launchMpGame session, so look up in _mpSessions)
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') {
        // announce join to host
        gameChannel.send({ type: 'broadcast', event: 'game_join', payload: { user: S.user, winId } });
        log('JOINING GAME: ' + winId + '...', 'sys');
      }
    });
}

// --game command dispatcher
async function handleGameCmd(args) {
  const sub = args[0]?.toLowerCase();

  if (!sub || sub === 'list') {
    // list active mp games in current room
    const active = Object.entries(_mpSessions);
    if (!active.length) { log('NO ACTIVE MULTIPLAYER GAMES. Make one: make multiplayer game (desc)', 'sys'); return; }
    let h = '<div class="hb"><div style="color:var(--accent);font-weight:900;margin-bottom:6px;">── ACTIVE GAMES ──</div>';
    active.forEach(([id, sess]) => {
      h += `<div style="margin:4px 0;"><span style="color:var(--accent)">${esc(id)}</span> <span style="color:#555;">${sess.isHost ? '[HOST]' : '[PLAYER ' + (sess.playerIndex + 1) + ']'} &#xB7; ${sess.playerCount} players</span></div>`;
    });
    h += '<div style="color:#444;font-size:11px;margin-top:6px;">--game join (id) to join a game</div></div>';
    log(h, 'inf');
    return;
  }

  if (sub === 'join') {
    const id = args[1];
    if (!id) { log('USAGE: --game join (game-id)', 'err'); return; }
    joinMpGame(id);
    return;
  }

  if (sub === 'leave' || sub === 'quit') {
    const id = args[1] || Object.keys(_mpSessions).slice(-1)[0];
    if (!id || !_mpSessions[id]) { log('NO GAME TO LEAVE.', 'sys'); return; }
    _mpSessions[id].channel?.unsubscribe();
    delete _mpSessions[id];
    log('LEFT GAME: ' + id, 'ok');
    return;
  }

  if (sub === 'invite') {
    // --game invite (username) (gameid)
    const target = args[1];
    const id = args[2] || Object.keys(_mpSessions).slice(-1)[0];
    if (!target || !id) { log('USAGE: --game invite (username) (gameid)', 'err'); return; }
    if (!S.currentRoom) { log('JOIN A ROOM FIRST.', 'err'); return; }
    // Send via inbox
    _ensureSB2(() => {
      const ch = window._sb2.channel('inbox:' + target.toLowerCase());
      ch.subscribe(st => {
        if (st === 'SUBSCRIBED') {
          ch.send({ type: 'broadcast', event: 'game_invite', payload: { from: S.user, room: S.currentRoom, winId: id } });
          setTimeout(() => ch.unsubscribe(), 3000);
          log(`GAME INVITE SENT to <span style="color:var(--accent)">${esc(target)}</span>`, 'ok');
        }
      });
    });
    return;
  }

  log('USAGE: --game list | --game join (id) | --game invite (user) (id) | --game leave', 'err');
}

/* ══════════════════════════════════════════════
   VENOM &#x2014; INBUILT MESSENGER
   Colors: #00FF41 toxic-green, #FF2020 scarlet
           #F5F5F5 white, #1E90FF frost-blue

// ── Venom state ──────────────────────────────
var _venom = { convos:{}, channels:{}, iframe:null, open:false, rtc:{} };

function _vKey(a,b){ return [a,b].map(function(x){return x.toLowerCase();}).sort().join('__'); }

async function vLoadHistory(user) {
  var k = _vKey(S.user, user);
  var raw = await sbFetch('venom/' + k + '.json');
  if (raw) { try { return JSON.parse(raw); } catch(e){} }
  return lsGet('venom_' + k) || [];
}
function vSaveHistory(user, msgs) {
  var k = _vKey(S.user, user);
  lsSet('venom_' + k, msgs.slice(-300));
  sbWrite('venom/' + k + '.json', JSON.stringify(msgs.slice(-300)));
}

function vSubscribePair(targetUser) {
  var k = _vKey(S.user, targetUser);
  if (_venom.channels[k] || !window._sb2) return;
  var ch = window._sb2.channel('venom:dm:' + k);
  _venom.channels[k] = ch;
  ch.on('broadcast', {event:'msg'}, function(data) {
    var payload = data.payload;
    if (!payload || payload.from === S.user) return;
    var msg = payload.msg, user = payload.from;
    if (!_venom.convos[user]) _venom.convos[user] = [];
    _venom.convos[user].push(msg);
    vSaveHistory(user, _venom.convos[user]);
    if (_venom.open && _venom.iframe)
      _venom.iframe.contentWindow.postMessage({type:'V_INCOMING',from:user,msg:msg},'*');
    notify('\u2623 <strong>'+esc(user)+'</strong>: '+esc((msg.text||'[media]').slice(0,50)),'ai-notif',6000);
  }).subscribe();
}

function vSubscribeInbox(username) {
  if (_venom.channels['_inbox'] || !window._sb2) return;
  var ch = window._sb2.channel('venom:user:'+username.toLowerCase());
  _venom.channels['_inbox'] = ch;
  ch.on('broadcast', {event:'dm'}, function(data) {
    var payload = data.payload;
    if (!payload || payload.from === S.user) return;
    var msg = payload.msg, user = payload.from;
    if (!_venom.convos[user]) _venom.convos[user] = [];
    _venom.convos[user].push(msg);
    vSaveHistory(user, _venom.convos[user]);
    if (_venom.open && _venom.iframe)
      _venom.iframe.contentWindow.postMessage({type:'V_INCOMING',from:user,msg:msg},'*');
    notify('\u2623 <strong>'+esc(user)+'</strong>: '+esc((msg.text||'[media]').slice(0,50)),'ai-notif',6000);
  }).subscribe();
}

function openVenom(dmUser) {
  if (!S.user) { log('LOGIN REQUIRED for Venom.','err'); return; }
