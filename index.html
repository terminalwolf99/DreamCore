      _venom.iframe = null;
      Object.keys(_venom.rtc).forEach(function(room){
        try{ _venom.rtc[room].send({type:'broadcast',event:'leave',payload:{user:S.user}}); _venom.rtc[room].unsubscribe(); }catch(err){}
      });
      _venom.rtc = {};
      if(_venom._overlay){_venom._overlay.remove();_venom._overlay=null;}
      URL.revokeObjectURL(blobUrl);
      log('Returned to DreamCore Terminal. Type --venom to reopen.','ok');
    }
  };
  window.addEventListener('message', blobHandler);
  log('&#x2623; VENOM OPEN'+(initialDM?' &#x2014; DM: '+esc(initialDM):''),'ok');
}

function showCallNotif(from, mode, room) {
  var nid = 'call_' + Date.now();
  var d = document.createElement('div');
  d.className = 'notif ai-notif';
  d.id = nid;
  d.style.cssText = 'pointer-events:all;min-width:200px;';
  var hdr = document.createElement('div');
  hdr.style.cssText = 'font-weight:900;margin-bottom:6px;color:#00FF41;';
  hdr.textContent = 'INCOMING CALL';
  var info = document.createElement('div');
  info.style.cssText = 'color:#aaa;font-size:11px;margin-bottom:8px;';
  info.textContent = esc(from) + ' is calling (' + (mode||'audio') + ')';
  var btns = document.createElement('div');
  btns.style.display = 'flex'; btns.style.gap = '8px';
  var ans = document.createElement('button');
  ans.textContent = 'ANSWER';
  ans.style.cssText = 'background:#00FF41;color:#000;border:none;padding:4px 10px;font-family:inherit;font-size:10px;font-weight:900;cursor:pointer;border-radius:2px;';
  ans.onclick = function(){ acceptVenomCall(room); d.remove(); };
  var dec = document.createElement('button');
  dec.textContent = 'DECLINE';
  dec.style.cssText = 'background:#FF2020;color:#fff;border:none;padding:4px 10px;font-family:inherit;font-size:10px;font-weight:900;cursor:pointer;border-radius:2px;';
  dec.onclick = function(){ d.remove(); };
  btns.appendChild(ans); btns.appendChild(dec);
  d.appendChild(hdr); d.appendChild(info); d.appendChild(btns);
  document.getElementById('notif-stack').appendChild(d);
  setTimeout(function(){ d.remove(); }, 30000);
}

function acceptVenomCall(room) {
  openVenom(null);
  setTimeout(function(){
    if (_venom.iframe) _venom.iframe.contentWindow.postMessage({type:'V_CALL_IN',room:room,video:true},'*');
  }, 800);
}

function joinGroupCall(room) {
  openVenom(null);
  setTimeout(function(){
    if (_venom.iframe) _venom.iframe.contentWindow.postMessage({type:'V_CALL_IN',room:room,video:true},'*');
  }, 800);
}

/* KEYBOARD */
$ci.addEventListener('keydown',async e=>{
  if(e.key==='Enter'){const v=$ci.value;$ci.value='';await exec(v);}
  if(e.key==='ArrowUp'){e.preventDefault();if(S.cmdIdx<S.cmdHist.length-1)$ci.value=S.cmdHist[++S.cmdIdx]||'';}
  if(e.key==='ArrowDown'){e.preventDefault();S.cmdIdx>0?$ci.value=S.cmdHist[--S.cmdIdx]:($ci.value='',S.cmdIdx=-1);}
  if(e.key==='Tab'){e.preventDefault();const userAliases=Object.keys(S.aliases||{});
    const C=['--help','--reach ','cd| ','--cd build dir ','--cd ls','--home',,'--end','--endx','--list','.disk -list','--encrypt -usr','--encrypt -usr -reset','--usr .','make game ','make ascii ','--alias set ','--alias list','--alias remove ','--saves','--save ','--load ','--pub =library ','--library','--library run ','--library remove ','--profile','--profile edit ','--theme ','--memory','--memory add ','--store','--store install ','--run ','--room ','--room leave','--room invite ','--room who','/say ','--game ','--game join ','--game invite ','--game list','make multiplayer game ','make solo game ','--venom','--venom ',...userAliases];const m=C.find(c=>c.startsWith($ci.value)&&c!==$ci.value);if(m)$ci.value=m;}
});
document.addEventListener('click',e=>{if(!e.target.closest('.win')&&!e.target.classList.contains('wb'))$ci.focus();});

/* BOOT */
const $flash=document.getElementById('boot-flash');
const $bcon =document.getElementById('boot-console');

function crtPrint(line,delay=0){
  return new Promise(res=>setTimeout(()=>{
    const d=document.createElement('div');
    d.style.cssText='opacity:0;transition:opacity .15s;color:#3a3a3a;';
    d.textContent=line;
    $bcon.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.opacity='1'));
    $bcon.scrollTop=$bcon.scrollHeight;
    res();
  },delay));
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function tubeOffSplash(){
  const $splash=document.getElementById('boot-splash');
  const $line=document.getElementById('boot-line');
  $splash.classList.add('tube-on');
  await sleep(700);
  $splash.classList.remove('tube-on');
  $splash.classList.add('tube-off');
  $line.classList.add('show');
  await sleep(380);
  $splash.style.display='none';
  $line.style.display='none';
}

function residueGlitchFX(){
  const $rf=document.getElementById('residue-fx');
  document.body.classList.add('residue-glitch');
  $rf.classList.add('show');
  setTimeout(()=>{
    document.body.classList.remove('residue-glitch');
    $rf.classList.remove('show');
  },500);
}

async function boot(){
  // ── LOGO SPLASH + CRT TUBE-OFF BLINK ───────────
  await tubeOffSplash();

  renderLogo();

  // ── CRT FLASH ──────────────────────────────────
  // Simulate phosphor burst when screen powers on
  await sleep(120);
  $flash.style.transition='opacity .05s';
  $flash.style.opacity='1';
  await sleep(55);
  $flash.style.transition='opacity .18s';
  $flash.style.opacity='0';
  await sleep(80);

  // Flicker the logo in like a CRT warming up
  const $bl=document.getElementById('boot-logo');
  $bl.style.opacity='0.15'; await sleep(60);
  $bl.style.opacity='0';    await sleep(40);
  $bl.style.opacity='0.7';  await sleep(35);
  $bl.style.opacity='0.2';  await sleep(55);
  $bl.style.opacity='1';

  // ── CONSOLE LINES ──────────────────────────────
  const lines=[
    {t:'BIOS v1.0 ........ OK',         d:0  },
    {t:'CPU CORE ......... DETECTED',    d:80 },
    {t:'MEMORY CHECK ..... 65536KB OK',  d:100},
    {t:'STORAGE DRIVER ... MOUNTING',    d:95 },
    {t:'IDB SUBSYSTEM .... INIT',        d:90 },
    {t:'CHROMATIC ENGINE . SYNCING',     d:85 },
    {t:'KERNEL v3.0 ...... LOADING',     d:95 },
    {t:'CLOUD UPLINK ..... TESTING',     d:80 },
  ];

  // Run console lines and storage init in parallel
  const idbPromise = initIDB();
  let charDelay=0;
  for(const l of lines){ await crtPrint(l.t, charDelay); charDelay=l.d; }

  const idbOk = await idbPromise;

  // Progress bar sweep
  const $bar=document.getElementById('boot-bar');
  const $msg=document.getElementById('boot-msg');
  const step=(p,m,t=60)=>{$bar.style.width=p+'%';$msg.textContent=m;return sleep(t);};
  await step(30,'');await step(60,'');await step(85,'');

  // Cloud probe
  $msg.textContent='TESTING CLOUD LINK...';
  const sbOk=await(async()=>{
    try{
      const r=await fetch(`${SB_URL}/storage/v1/object/list/${BUCKET}`,{
        method:'POST',
        headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'},
        body:JSON.stringify({prefix:'users/',limit:1,offset:0})
      });
      return r.status===200||r.status===400;
    }catch{return false;}
  })();

  await crtPrint(sbOk ? 'SUPABASE ......... CONNECTED' : 'SUPABASE ......... OFFLINE', 60);
  await crtPrint('BOOT COMPLETE.', 80);
  await step(100,'READY.',200);

  // ── FADE OUT BOOT ──────────────────────────────
  $boot.style.opacity='0';
  await sleep(400);
  $boot.style.display='none';

  // ── TERMINAL READY ─────────────────────────────
  log('DREAMCORE TERMINAL v3.0 &#x2014; OPEN SOURCE AI KERNEL','sys');
  _sbOnline=sbOk;
  if(sbOk)log('STORAGE: <span style="color:var(--ok)">&#x2601; SUPABASE CONNECTED</span> &#x2014; data syncs across all your devices','sys');
  else if(idbOk)log('STORAGE: <span style="color:#ffaa00">&#x25C9; LOCAL ONLY (IndexedDB)</span> &#x2014; open locally for cloud sync','sys');
  else log('STORAGE: <span style="color:var(--err)">&#x25C8; SESSION MEMORY ONLY</span> &#x2014; download & open locally','sys');
  log('Type <span class="hc">--help</span> for commands &nbsp;&#xB7;&nbsp; <span class="hc">--usr .(name)</span> to sign in','inf');
  updatePrompt();
  residueGlitchFX();
}
boot();
