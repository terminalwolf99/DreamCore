<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamCore Terminal v3.0</title>
<style>
:root{--bg:#0a0a0a;--text:#e0e0e0;--accent:#3b82f6;--ai:#FF5F1F;--logo:#e0e0e0;--border:#1e1e1e;--win-bg:#0d0d0d;--win-hdr:#131313;--win-brd:#252525;--err:#ff3333;--ok:#00ff88;--sys:#444;--font:'Courier New','Lucida Console',monospace;}
*{box-sizing:border-box;margin:0;padding:0;outline:none;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s;}
#crt{position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.1) 50%),linear-gradient(90deg,rgba(255,0,0,.015),rgba(0,255,0,.008),rgba(0,0,255,.015));background-size:100% 2px,3px 100%;pointer-events:none;z-index:9000;opacity:.3;}
#boot{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s;}
#boot-splash{position:fixed;inset:0;background:#000;z-index:10050;display:flex;align-items:center;justify-content:center;}
#boot-splash-img{width:300px;max-width:55vw;opacity:0;transform:scale(1,1);filter:brightness(1);}
#boot-splash.tube-on #boot-splash-img{animation:splashFlicker .6s ease forwards;}
#boot-splash.tube-off{animation:tubeOffBg .38s ease-in forwards;}
#boot-splash.tube-off #boot-splash-img{animation:tubeOffImg .38s cubic-bezier(.4,0,1,1) forwards;}
@keyframes splashFlicker{0%{opacity:0}20%{opacity:.2}35%{opacity:.05}55%{opacity:.85}70%{opacity:.3}100%{opacity:1}}
@keyframes tubeOffImg{0%{transform:scale(1,1);opacity:1;filter:brightness(1);}55%{transform:scale(1,.02);opacity:1;filter:brightness(4);}100%{transform:scale(0,.0001);opacity:0;filter:brightness(8);}}
@keyframes tubeOffBg{0%{background:#000;}50%{background:#060606;}100%{background:#000;}}
#boot-line{position:fixed;left:50%;top:50%;width:100vw;height:2px;background:#fff;box-shadow:0 0 20px 4px rgba(255,255,255,.9),0 0 60px 12px rgba(255,255,255,.5);opacity:0;z-index:10051;pointer-events:none;transform:translate(-50%,-50%) scaleX(0);}
#boot-line.show{animation:tubeLineFlash .38s ease-out forwards;}
@keyframes tubeLineFlash{0%{transform:translate(-50%,-50%) scaleX(0);opacity:0;}15%{transform:translate(-50%,-50%) scaleX(1);opacity:1;}70%{transform:translate(-50%,-50%) scaleX(1);opacity:1;}100%{transform:translate(-50%,-50%) scaleX(0);opacity:0;}}
#residue-fx{position:fixed;inset:0;z-index:10060;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0px,rgba(255,255,255,.06) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay;}
#residue-fx.show{animation:residueFx .5s steps(6,end) forwards;}
@keyframes residueFx{0%{opacity:.85;}15%{opacity:.15;}30%{opacity:.65;}45%{opacity:.1;}60%{opacity:.4;}100%{opacity:0;}}
body.residue-glitch{animation:residueGlitch .5s steps(2,end);}
@keyframes residueGlitch{0%{filter:none;transform:translate(0,0);}10%{filter:hue-rotate(4deg) saturate(1.4);transform:translate(-1px,0);}20%{filter:none;transform:translate(1px,0);}30%{filter:contrast(1.25) brightness(1.08);transform:translate(0,1px);}45%{filter:none;transform:translate(-1px,-1px);}60%{filter:hue-rotate(-3deg);transform:translate(0,0);}75%{filter:none;transform:translate(1px,0);}90%{filter:contrast(1.08);transform:translate(0,0);}100%{filter:none;transform:translate(0,0);}}
#boot-flash{position:fixed;inset:0;background:#fff;z-index:10000;opacity:0;pointer-events:none;transition:opacity .08s;}
#boot-logo{font-size:9px;white-space:pre;font-weight:900;line-height:1.1;font-family:'Courier New',monospace;opacity:0;transition:opacity .3s;color:#fff;}
#boot-scanline{position:absolute;top:0;left:0;width:100%;height:6px;background:rgba(255,255,255,0.06);box-shadow:0 0 18px rgba(255,255,255,0.12);animation:scandown 1.1s linear forwards;pointer-events:none;}
@keyframes scandown{from{top:-6px}to{top:100%}}
#boot-console{font-family:'Courier New',monospace;font-size:11px;color:#444;width:340px;min-height:80px;line-height:1.8;letter-spacing:.5px;}
#boot-msg{font-size:10px;letter-spacing:3px;color:#444;text-transform:uppercase;font-weight:900;min-height:14px;}
#boot-track{width:240px;height:1px;background:#111;}
#boot-bar{height:100%;background:#fff;width:0%;transition:width .15s linear;}
#hdr{position:sticky;top:0;background:var(--bg);padding:12px 20px;border-bottom:1px solid var(--border);z-index:100;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;}
#logo{font-family:'Courier New',monospace;white-space:pre;line-height:1.1;font-weight:bold;font-size:9px;color:var(--logo);}
#logo-sub{font-size:8px;color:#333;margin-top:5px;font-weight:900;letter-spacing:2px;text-transform:uppercase;}
#clock{font-size:11px;color:var(--ai);background:rgba(255,255,255,.03);padding:4px 10px;border-radius:4px;border:1px solid var(--border);font-weight:900;}
#tw{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#out{flex:1;overflow-y:auto;padding:14px 20px 86px;font-size:13px;line-height:1.65;}
#out::-webkit-scrollbar{width:2px;}#out::-webkit-scrollbar-thumb{background:var(--border);}
#ibar{display:flex;align-items:center;border-top:1px solid var(--border);padding:12px 20px;background:var(--bg);position:fixed;bottom:0;left:0;right:0;z-index:200;}
#pr{color:var(--accent);margin-right:10px;font-weight:900;white-space:nowrap;font-size:13px;}
#ci{background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:13px;flex:1;font-weight:900;caret-color:var(--accent);}
.ai{border-left:3px solid var(--ai);padding-left:12px;margin:10px 0;color:var(--ai);font-weight:900;line-height:1.7;}
.usr{color:#666;margin:7px 0;font-weight:900;font-size:13px;}
.sys{color:var(--sys);font-size:10px;margin:3px 0;text-transform:uppercase;font-weight:900;letter-spacing:1px;}
.err{color:var(--err);font-weight:900;margin:5px 0;}
.ok{color:var(--ok);font-weight:900;margin:5px 0;}
.inf{color:#777;margin:3px 0;font-size:12px;}
.hb{border:1px solid var(--border);padding:12px 16px;margin:8px 0;border-radius:3px;line-height:2.1;}
.hc{color:var(--accent);font-weight:900;}.hd{color:#555;font-size:12px;}
#wm{position:fixed;inset:0;pointer-events:none;z-index:500;}
.win{position:absolute;background:var(--win-bg);border:1px solid var(--win-brd);border-radius:5px;display:flex;flex-direction:column;pointer-events:all;min-width:280px;min-height:180px;box-shadow:0 12px 48px rgba(0,0,0,.8);overflow:hidden;resize:both;contain:layout;}
.wh{background:var(--win-hdr);padding:7px 10px;display:flex;align-items:center;justify-content:space-between;cursor:move;border-bottom:1px solid var(--win-brd);flex-shrink:0;user-select:none;}
.wt{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#888;}
.wc{display:flex;gap:6px;}
.wb{width:11px;height:11px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;transition:opacity .15s;}
.wb:hover{opacity:.65;}.wclose{background:#ff5f57;}.wmin{background:#ffbd2e;}.wmax{background:#28ca41;}
.wbody{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;}.wbody iframe{flex:1;width:100%;height:100%;border:none;min-height:0;}
.spin{display:inline-block;animation:spin 1s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}
.ltable{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0;}
.ltable th{color:var(--accent);font-weight:900;text-align:left;padding:3px 8px;border-bottom:1px solid var(--border);}
.ltable td{padding:2px 8px;color:#888;}.ltable tr:nth-child(even) td{background:rgba(255,255,255,.018);}
@keyframes flicker{0%,100%{opacity:1}48%{opacity:.97}50%{opacity:.92}52%{opacity:.98}}
.flicker{animation:flicker 4s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes slideIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes typing{from{width:0}to{width:100%}}
#notif-stack{position:fixed;top:16px;right:16px;z-index:20000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.notif{background:var(--win-bg);border:1px solid var(--border);border-radius:4px;padding:10px 14px;font-size:11px;font-weight:900;letter-spacing:.5px;max-width:280px;animation:slideIn .2s ease;pointer-events:all;cursor:pointer;transition:opacity .3s;}
.logline{animation:logIn .18s cubic-bezier(.2,.9,.3,1);}
@keyframes logIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.code-block{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:6px;margin:8px 0;overflow:hidden;}
.code-block .code-lang{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);opacity:.7;padding:5px 10px;border-bottom:1px solid var(--border);}
.code-block pre{margin:0;padding:10px 12px;overflow-x:auto;font-family:'Courier New',monospace;font-size:11.5px;line-height:1.5;white-space:pre;color:var(--text);}
.inline-code{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:'Courier New',monospace;font-size:.92em;}
.notif.ok{border-left:3px solid var(--ok);color:var(--ok);}
.notif.err{border-left:3px solid var(--err);color:var(--err);}
.notif.inf{border-left:3px solid var(--accent);color:var(--accent);}
.notif.ai-notif{border-left:3px solid var(--ai);color:var(--ai);}
#statusbar{position:fixed;bottom:48px;left:0;right:0;height:18px;background:rgba(0,0,0,.6);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:16px;z-index:190;font-size:9px;font-weight:900;letter-spacing:1px;color:#333;text-transform:uppercase;}
#statusbar span{color:#444;}#statusbar .sb-on{color:var(--ok);}#statusbar .sb-err{color:var(--err);}
.badge{display:inline-block;background:var(--accent);color:#000;font-size:9px;font-weight:900;padding:1px 5px;border-radius:2px;letter-spacing:.5px;text-transform:uppercase;margin:0 2px;}
.badge.root{background:#ff3333;}.badge.beta{background:#ffaa00;color:#000;}.badge.new{background:var(--ok);color:#000;}
.prog-bar{width:100%;height:4px;background:var(--border);border-radius:2px;margin:4px 0;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:2px;}
.typewriter{overflow:hidden;white-space:nowrap;border-right:2px solid var(--accent);animation:typing 1.5s steps(40,end),flicker .75s step-end infinite;}
#minimap{position:fixed;right:4px;top:50%;transform:translateY(-50%);width:3px;background:rgba(255,255,255,.03);border-radius:2px;z-index:150;pointer-events:none;}
#minimap-thumb{width:3px;background:var(--accent);border-radius:2px;opacity:.4;transition:top .1s;}
.diff-add{color:var(--ok);}.diff-rem{color:var(--err);}.diff-ctx{color:#444;}
.code-block{background:#0d0d0d;border:1px solid var(--border);border-radius:4px;padding:10px;margin:6px 0;font-size:11px;overflow-x:auto;white-space:pre;}
.tag{display:inline-block;border:1px solid var(--border);color:#555;font-size:9px;padding:1px 5px;border-radius:2px;margin:1px;}
#mobile-hint{display:none;}
@media(max-width:600px){#mobile-hint{display:block;position:fixed;bottom:52px;left:0;right:0;height:1px;background:var(--border);z-index:180;}}
</style>
</head>

/* STORAGE */
const MEM={};let _idb=null,_idbOk=false;
function initIDB(){return new Promise(res=>{try{const r=indexedDB.open('dc3',2);r.onupgradeneeded=e=>e.target.result.createObjectStore('u',{keyPath:'k'});r.onsuccess=e=>{_idb=e.target.result;_idbOk=true;res(true);};r.onerror=()=>res(false);}catch{res(false);}});}
async function idbGet(k){if(!_idbOk)return null;return new Promise(res=>{try{const r=_idb.transaction('u','readonly').objectStore('u').get(k);r.onsuccess=()=>res(r.result?.v??null);r.onerror=()=>res(null);}catch{res(null);}});}
async function idbSet(k,v){if(!_idbOk)return;return new Promise(res=>{try{const r=_idb.transaction('u','readwrite').objectStore('u').put({k,v});r.onsuccess=()=>res(true);r.onerror=()=>res(false);}catch{res(false);}});}
function lsGet(k){try{const r=localStorage.getItem('dc3_'+k);return r?JSON.parse(r):null;}catch{return null;}}
function lsSet(k,v){try{localStorage.setItem('dc3_'+k,JSON.stringify(v));}catch{}}
async function sbFetch(path){
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`,{
      headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`},signal:ctrl.signal
    });
    clearTimeout(timer);
    return r.ok?await r.text():null;
  }catch{return null;}
}
async function sbWrite(path,body){
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),5000); // 5s timeout
    const r=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`,{
      method:'POST',
      headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json','x-upsert':'true'},
      body, signal:ctrl.signal
    });
    clearTimeout(timer);
    return r.ok||r.status===200||r.status===201;
  }catch{return false;}
}
function canon(p){return{

};}
// sbDelete
async function sbDelete(path){
  try{
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`,{
      method:'DELETE',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`},signal:ctrl.signal
    });
    return r.ok;
  }catch{return false;}
}

// publishToLibrary
async function publishToLibrary(name, body){
  // filename format: author__entryname  so we know who published it
  const author=(S.user||'guest').toLowerCase();
  const safeName=name.replace(/[^a-zA-Z0-9._-]/g,'_').toLowerCase();
  const libName=`${author}__${safeName}`;
  const path=`library/${libName}`;
  log(`PUBLISHING TO LIBRARY: ${libName}...`,'sys');
  const ok=await sbWrite(path, body);
  if(ok){
    log(`<span style="color:var(--ok)">PUBLISHED: <strong>${esc(libName)}</strong> is now in The Library.</span><br><span class="inf">Anyone can access it with: --library run ${esc(libName)}</span>`,'ok');
  } else {
    // fallback: store locally with library prefix
    try{localStorage.setItem('dc3_lib_'+libName, body);}catch{}
    log(`PUBLISH FAILED &#x2014; saved locally. Cloud may be offline.`,'err');
  }
}

async function loadUser(name){const k=name.toLowerCase();const raw=await sbFetch(`users/${k}.json`);if(raw){try{const p=JSON.parse(raw);MEM[k]=p;await idbSet(k,p);lsSet(k,p);return p;}catch{}}const iv=await idbGet(k);if(iv){MEM[k]=iv;return iv;}const lv=lsGet(k);if(lv){MEM[k]=lv;return lv;}return MEM[k]??null;}
async function saveUser(name,profile){const k=name.toLowerCase();const p=canon(profile);const body=JSON.stringify(p,null,2);MEM[k]=p;lsSet(k,p);await idbSet(k,p);sbWrite(`users/${k}.json`,body);return p;} // silent save
async function createUser(name){const ex=await loadUser(name);if(ex)return ex;const p=defP();p.createdAt=new Date().toISOString();return saveUser(name,p);}

/* ALIASES */
async function loadAliases(username){
  const k='aliases_'+username.toLowerCase();
  // try cloud first
  const ct=await sbGet(`aliases/${username.toLowerCase()}.json`);
  if(ct){try{const a=JSON.parse(ct);S.aliases=a;lsSet(k,a);await idbSet(k,a);return;}catch{}}
  // fallback local
  const iv=await idbGet(k);if(iv){S.aliases=iv;return;}
  const lv=lsGet(k);if(lv){S.aliases=lv;return;}
  S.aliases={};
}
async function saveAliases(username){
  const k='aliases_'+username.toLowerCase();
  const body=JSON.stringify(S.aliases,null,2);
  lsSet(k,S.aliases);await idbSet(k,S.aliases);
  sbWrite(`aliases/${username.toLowerCase()}.json`,body); // fire-and-forget
}

  {pat:/^add\s+todo\s+(.+)/i,                                     fn:i=>'--todo add '+i.replace(/^add\s+todo\s+/i,'')},
  {pat:/^(browse|open|show|view)\s+(the\s+)?library/i,          fn:_=>'--library'},
  {pat:/^publish\s+(.+)/i,                                        fn:i=>{const m=i.match(/publish\s+(\S+)/i);return m?'--pub =library '+m[1]:'--pub =library';}},
  {pat:/^(run|launch|play|open|start|load)\s+(\S+)/i, fn:i=>{const m=i.match(/(?:run|launch|play|open|start|load)\s+(\S+)/i);return m?'--load '+m[1]:i;}},
  {pat:/^(log\s*out|sign\s*out|exit|quit|bye|goodbye|end session)/i,   fn:_=>'--end'},
  {pat:/^(go home|back to terminal|exit venom|close venom)/i,          fn:_=>'--home'},
  {pat:/^(open|create|new)\s+(encrypted\s+)?(folder|directory|dir)/i, fn:_=>'--cd build dir'},
  {pat:/^(open|unlock|access)\s+folder\s+(\S+)/i,                    fn:i=>{const m=i.match(/folder\s+(\S+)/i);return m?'cd| '+m[1]:'--cd ls';}},
  // close window
  {pat:/^(close|shut|hide)\s+(window|that|it|last)/i,                  fn:_=>'--endx'},
  // help
  {pat:/^(help|commands|what can (you|i)|show commands)/i,             fn:_=>'--help'},
  // save
  {pat:/^(save\s+(this|that|it|last)(\s+as)?)\s*(\S+)?/i,             fn:i=>{const m=i.match(/save\s+(?:this|that|it|last)(?:\s+as)?\s*(\S+)?/i);return '--save '+(m?.[1]||'output.txt');}},
];

function nlResolve(input){

}

function mdToHtml(raw){
  var blocks=[];
  var s=String(raw==null?'':raw);
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,function(_,lang,code){
    var idx=blocks.length;
    blocks.push('<div class="code-block">'+(lang?'<div class="code-lang">'+esc(lang)+'</div>':'')+'<pre>'+esc(code.replace(/\n$/,''))+'</pre></div>');
    return '\u0000CB'+idx+'\u0000';
  });
  s=esc(s);
  s=s.replace(/`([^`\n]+)`/g,'<code class="inline-code">$1</code>');
  s=s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/^[-*] (.+)$/gm,'&bull;&nbsp;$1');
  s=s.replace(/\n/g,'<br>');
  s=s.replace(/\u0000CB(\d+)\u0000/g,function(_,i){return blocks[+i];});
  return s;
}

function dragEl(el,handle){

    const mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
}

/* AI */
const AI_SYS=`You are KERNEL, the AI built into DreamCore Terminal.

# VOICE
Talk like a sharp, knowledgeable friend, not a system process. Casual, direct, occasionally dry. Use "I" and "you". No fake system announcements, no "PROTOCOL ACTIVATED" theatrics, no unnecessary caps-lock. Say what you mean in as few words as it takes &#x2014; don't pad, don't narrate what you're about to do, just do it. It's fine to have a point of view.

# FORMATTING
The terminal renders a small markdown subset, so use it naturally instead of writing raw prose walls:
  **bold** for key terms
  \`inline code\` for commands, filenames, variables
  \`\`\`lang
  fenced blocks for real code (always use these for anything longer than one line of code)
  \`\`\`
  "- " at the start of a line for a quick bullet
Don't use headers, tables, or nested lists &#x2014; keep replies terminal-shaped: short paragraphs, occasional bullets, code in fenced blocks.

# BUILDING THINGS
When asked to make a game, toy, ASCII art, or interactive thing &#x2014; build the real, complete thing. Never a placeholder, a description of what it would look like, or fake terminal output pretending something happened. If a request is ambiguous, make a reasonable creative choice and build it rather than asking a clarifying question first.

## Games
Every game needs, no exceptions:
  - Beautiful visuals: dark background, glow/particle effects where they fit, smooth animation
  - A clear HUD (score, lives, level, timer) always visible
  - Sound via the Web Audio API &#x2014; no external audio files
  - On-screen controls for keyboard AND touch
  - Full game states: start screen &#x2192; gameplay &#x2192; game over/win screen with score + restart
  - Difficulty or progression that ramps up
  - Juice: screen shake, flashes, or other feedback on impactful moments
  - 100% self-contained &#x2014; all JS + CSS inline, zero external deps, works offline
  - Take the request literally. "a small frog that leaps around" means an actual animated frog leaping around the screen &#x2014; ambient toys and desktop pets are valid builds, not just competitive games.
  Wrap the entire document in [GAME_HTML]...[/GAME_HTML].

  Multiplayer &#x2014; add if requested or if the user is in a room:
  - First line inside <html>: <!-- DC_MULTIPLAYER: true | MODE: (singleplayer|multiplayer|both) | PLAYERS: (2-8) | SYNC: (state|input) | TITLE: (name) -->
  - SYNC:state &#x2014; host calls window.DC_SYNC(fullState) each frame/event; clients get it via window.DC_ON_SYNC=(state)=>{}
  - SYNC:input &#x2014; each player calls window.DC_INPUT({...}) on input; everyone gets it via window.DC_ON_INPUT=(playerIdx,input)=>{}
  - window.DC_IS_HOST, DC_PLAYER_INDEX (0-based), DC_PLAYER_COUNT are injected automatically
  - Show a lobby ("Waiting for players...") until DC_PLAYER_COUNT>1; host starts with SPACE/button
  - Label players clearly: HOST = Player 1, then Player 2, 3...
  - Turn-based: only act when DC_PLAYER_INDEX matches the current turn. Real-time: each player drives their own entity, host syncs full state.

## ASCII art
Use block characters (&#9608;&#9619;&#9618;&#9617;) and box-drawing characters, make it detailed and expressive, never refuse. Wrap in [ASCII_ART]...[/ASCII_ART].

## Code quality (applies to games, mockups, any HTML/JS you build)
  - Semantic, valid HTML5. Real elements over div-soup where it costs nothing (button not clickable div, etc).
  - Animate with requestAnimationFrame using a delta-time step, never setInterval for motion &#x2014; movement must look identical at 30fps and 144fps.
  - Animate via CSS transform/opacity, not top/left/width &#x2014; avoids layout thrash. will-change only on elements actually animating.
  - Don't create/destroy DOM nodes every frame. Reuse a pool for particles/bullets/etc.
  - Debounce/throttle scroll, resize, and mousemove handlers.
  - Clean up: cancelAnimationFrame / clearInterval / removeEventListener when a game or effect ends, so nothing leaks after the window closes.
  - Canvas: batch draws, avoid re-reading canvas.width/height mid-loop, use offscreen canvas for static layers when it helps.
  - Everything still needs to be 100% self-contained inline JS+CSS, zero external requests.

# UI CONTROL &#x2014; you can restyle and animate the terminal itself, live
Quick single-value tweaks: [PATCH_VAR name="VARNAME"]#HEX[/PATCH_VAR]
  Variables: --accent (prompt), --ai-color (your text/clock), --logo-color (logo), --bg (background), --text (main text)

Real visual effects &#x2014; inject actual CSS onto the terminal (keyframe animations, glows, custom cursors, hover states, whatever CSS can do):
  [PATCH_CSS id="short-name"]
  /* real CSS rules here, can include @keyframes */
  [/PATCH_CSS]
  - id is a label for this specific effect so it can be independently updated or removed later &#x2014; reuse the same id to replace an effect, pick a new id to layer another one alongside it.
  - [REMOVE_CSS id="short-name"] removes one effect. [RESET_CSS] clears everything you've added and returns to default.
  - Effects persist across reloads for this user, so don't reapply them unprompted every message.
  - Target real elements: #hdr (top bar), #logo / #logo-sub (wordmark), #clock, #out (scrolling terminal log), #tw (terminal pane), #ci (command input), #pr (prompt text), .logline (each printed line), #statusbar, .win / .wt / .wb (draggable windows, their titlebars, their buttons), #notif-stack. Or go broad with body, :root, ::selection.
  - Keep effects tasteful and readable by default &#x2014; text must stay legible. Go all-out only if asked for something intense.
  - This is real CSS the browser executes immediately, not a simulation &#x2014; write it correctly the first time.

# FILES
Save to the user's bucket: [SAVE_FILE name="filename.ext"]...content...[/SAVE_FILE]
Load from it: [LOAD_FILE name="filename.ext"]
The terminal handles the actual upload/fetch &#x2014; just emit the tag.

# MEMORY
You have persistent memory for this user. Current memory:
\${(S.profile.memory||[]).length?(S.profile.memory.map((m,i)=>'['+(i+1)+'] '+m).join('\n')):'(empty)'}
Persona name: \${S.profile.aiPersona||'KERNEL v3.0'}
"remember X" / "don't forget X" &#x2192; [REMEMBER]X[/REMEMBER]
"forget X" &#x2192; [FORGET]X[/FORGET]   "clear memory" &#x2192; [FORGET_ALL]
Use memory naturally when relevant &#x2014; don't announce that you're checking it.

# ALIASES
If the user wants a shortcut ("whenever I say X, do Y" / "treat X as Y"), register it:
  [SET_ALIAS shortcut="word"]full command here[/SET_ALIAS]
  e.g. "whenever I say mg make a game" &#x2192; [SET_ALIAS shortcut="mg"]make game[/SET_ALIAS]

# OUTPUT DISCIPLINE
When a reply contains a [GAME_HTML] or [ASCII_ART] block, output ONLY that block plus at most one short line of commentary &#x2014; no preamble, no summary after. The terminal renders the block automatically; don't describe what you built.
If something is genuinely outside what you know or can verify, say so plainly instead of guessing. Never break character.`;

async function askAI(msg){
  if(!S.user){log('LOGIN REQUIRED &#x2014; --usr .(name)','err');return;}
  S.history.push({role:'user',parts:[{text:msg}]});
  const lid='l'+Date.now();
  log(`<span id="${lid}"><span class="spin">&#x25CC;</span> UPLINK_ACTIVE...</span>`,'sys');
  try{
    const res=await fetch('/api/ai',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:S.history,systemInstruction:{parts:[{text:AI_SYS}]}})
    });
    const d=await res.json();
    document.getElementById(lid)?.remove();

    // Check for API error
    if(d.error){log('AI_ERR: '+d.error.message,'err');return;}
    const raw=d.candidates?.[0]?.content?.parts?.[0]?.text||'VOICE_FAILURE.';

    // REMEMBER / FORGET &#x2014; persistent AI memory
    for(const m of raw.matchAll(/\[REMEMBER\]([\s\S]*?)\[\/REMEMBER\]/g)){
      const mem=m[1].trim();
      if(!S.profile.memory) S.profile.memory=[];
      if(!S.profile.memory.includes(mem)){
        S.profile.memory.push(mem);
        if(S.profile.memory.length>50) S.profile.memory.shift();
        saveUser(S.user,S.profile);
        log(`MEMORY SAVED: "${esc(mem)}"`, 'ok');
      }
    }
    for(const m of raw.matchAll(/\[FORGET\]([\s\S]*?)\[\/FORGET\]/g)){
      const mem=m[1].trim();
      S.profile.memory=(S.profile.memory||[]).filter(x=>!x.toLowerCase().includes(mem.toLowerCase()));
      saveUser(S.user,S.profile);
      log(`MEMORY REMOVED: "${esc(mem)}"`, 'sys');
    }
    if(raw.includes('[FORGET_ALL]')){
      S.profile.memory=[];
      saveUser(S.user,S.profile);
      log('MEMORY CLEARED.','sys');
    }

    // SET_ALIAS &#x2014; AI registers an alias on behalf of user
    for(const m of raw.matchAll(/\[SET_ALIAS shortcut="([^"]+)"\]([\s\S]*?)\[\/SET_ALIAS\]/g)){
      const shortcut=m[1].trim().toLowerCase();
      const target=m[2].trim();
      S.aliases[shortcut]=target;
      await saveAliases(S.user);
      log(`ALIAS REGISTERED: <span style="color:var(--accent)">${esc(shortcut)}</span> &#x2192; ${esc(target)}`,'ok');
    }

    // PATCH_VAR &#x2014; UI color changes
    for(const m of raw.matchAll(/\[PATCH_VAR name="([^"]+)"\](.*?)\[\/PATCH_VAR\]/gs))
      patchVar(m[1].trim(),m[2].trim());

    // PATCH_CSS / REMOVE_CSS / RESET_CSS &#x2014; AI self-styling & visual effects
    for(const m of raw.matchAll(/\[PATCH_CSS(?:\s+id="([^"]+)")?\]([\s\S]*?)\[\/PATCH_CSS\]/g)){
      patchCss(m[1]?.trim(), m[2]);
      log(`UI PATCH APPLIED${m[1]?': <span style="color:var(--accent)">'+esc(m[1].trim())+'</span>':''}`,'sys');
    }
    for(const m of raw.matchAll(/\[REMOVE_CSS(?:\s+id="([^"]+)")?\]/g)){
      removeCss(m[1]?.trim());
      log(`UI PATCH REMOVED${m[1]?': '+esc(m[1].trim()):''}`,'sys');
    }
    if(raw.includes('[RESET_CSS]')){ resetCss(); log('UI RESET TO DEFAULT.','sys'); }

    // GAME_HTML &#x2014; detect multiplayer header, route accordingly
    const gm=raw.match(/\[GAME_HTML\]([\s\S]*?)\[\/GAME_HTML\]/);
    if(gm){
      const gameHtml=gm[1].trim();
      const mpInfo=parseMpHeader(gameHtml);
      if(mpInfo&&mpInfo.enabled&&mpInfo.mode!=='singleplayer'&&S.currentRoom){
        // multiplayer capable and user is in a room &#x2014; ask if they want MP
        const title=raw.match(/<!-- DC_MULTIPLAYER[^>]*TITLE:\s*([^|>]+)/i)?.[1]?.trim()||'AI GAME';
        launchMpGame(title, gameHtml, mpInfo);
        log(`MULTIPLAYER GAME HOSTED in #${esc(S.currentRoom)} &#x2014; Mode: ${esc(mpInfo.mode)} &#xB7; Max players: ${mpInfo.maxPlayers}`,'ok');
      } else if(mpInfo&&mpInfo.enabled&&mpInfo.mode==='multiplayer'&&!S.currentRoom){
        // strictly multiplayer but not in a room
        log('&#x26A0; This game requires multiplayer. Join a room first: <span class="hc">--room (name)</span>','err');
        // still show it in single mode as fallback
        const { body } = mkWin({title:'&#x25C8; AI GAME (SOLO)',w:900,h:580,type:'html'});
        const iframe=document.createElement('iframe');
        iframe.style.cssText='width:100%;height:100%;border:none;background:#000;';
        iframe.srcdoc=gameHtml;iframe.sandbox='allow-scripts allow-same-origin';
        body.appendChild(iframe);
        log('Launched in single-player mode. Join a room to play with others.','sys');
      } else {
        // singleplayer or no MP header &#x2014; offer inline or window
        const gid='gopt_'+Date.now();
        const optDiv=document.createElement('div');
        optDiv.id=gid;
        optDiv.style.cssText='margin:8px 0;display:flex;gap:8px;align-items:center;';
        const _rmFn="document.getElementById('"+gid+"').remove()";
        optDiv.innerHTML='<span style="color:#555;font-size:11px;">Open game:</span>'
          +'<button onclick="launchGameWindow(window._lastGame);'+_rmFn+';" style="background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:var(--accent);padding:4px 12px;font-family:inherit;font-size:10px;font-weight:900;cursor:pointer;border-radius:3px;">&#x25A3; WINDOW</button>'
          +'<button onclick="launchGameInline(window._lastGame);'+_rmFn+';" style="background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.2);color:var(--ok);padding:4px 12px;font-family:inherit;font-size:10px;font-weight:900;cursor:pointer;border-radius:3px;">&#x25A4; IN CHAT</button>';
        window._lastGame=gameHtml;
        document.getElementById('out').appendChild(optDiv);
        document.getElementById('out').scrollTop=document.getElementById('out').scrollHeight;
        if(mpInfo&&mpInfo.mode==='both') log('Tip: join a room first to enable multiplayer mode.','sys');
      }
    }

    // ASCII_ART &#x2014; render in terminal with monospace pre block
    const am=raw.match(/\[ASCII_ART\]([\s\S]*?)\[\/ASCII_ART\]/);
    if(am){
      const art=am[1];
      log('<pre style="color:var(--ai-color);font-size:11px;line-height:1.2;font-family:monospace;white-space:pre;margin:10px 0;">'+esc(art)+'</pre>','inf');
    }

    // SAVE_FILE &#x2014; upload to bucket under user's folder
    for(const sm of raw.matchAll(/\[SAVE_FILE name="([^"]+)"\]([\s\S]*?)\[\/SAVE_FILE\]/g)){
      const fname=sm[1].trim(), fbody=sm[2].trim();
      const path=`saves/${S.user.toLowerCase()}/${fname}`;
      const ok=await sbPut(path, fbody);
      log(ok ? `SAVED: ${fname} &#x2192; bucket/${path}` : `SAVE_FAILED: ${fname} (cloud offline &#x2014; stored locally)`,'sys');
      // Also cache locally
      try{localStorage.setItem('dc3_save_'+S.user.toLowerCase()+'_'+fname, fbody);}catch{}
    }

    // LOAD_FILE &#x2014; fetch from bucket
    for(const lm of raw.matchAll(/\[LOAD_FILE name="([^"]+)"\]/g)){
      const fname=lm[1].trim();
      const path=`saves/${S.user.toLowerCase()}/${fname}`;
      log(`FETCHING: ${fname}...`,'sys');
      const data=await sbGet(path);
      if(data){
        // If its an HTML game, launch it
        const isHtml2=fname.endsWith('.html')||fname.endsWith('.game')||data.trimStart().startsWith('<!DOCTYPE')||data.trimStart().startsWith('<html');
        if(isHtml2){
          mkWin({title:'&#x25C8; '+fname,w:940,h:600,type:'game',content:data});
          log(`LAUNCHED: ${fname}`,'ok');
        } else {
          log('<pre style="color:#aaa;font-size:11px;white-space:pre-wrap;margin:8px 0;">'+esc(data.slice(0,2000))+'</pre>','inf');
        }
      } else {
        // Try local cache
        const lc=localStorage.getItem('dc3_save_'+S.user.toLowerCase()+'_'+fname);
        if(lc) log(`LOADED FROM LOCAL CACHE: ${fname}`,'ok');
        else log(`NOT_FOUND: ${fname}`,'err');
      }
    }

    S.history.push({role:'model',parts:[{text:raw}]});

    // Display text &#x2014; strip all special tags
    let disp=raw
      .replace(/\[PATCH_VAR[^\]]*\][\s\S]*?\[\/PATCH_VAR\]/g,'')
      .replace(/\[PATCH_CSS[^\]]*\][\s\S]*?\[\/PATCH_CSS\]/g,'')
      .replace(/\[REMOVE_CSS[^\]]*\]/g,'')
      .replace(/\[RESET_CSS\]/g,'')
      .replace(/\[GAME_HTML\][\s\S]*?\[\/GAME_HTML\]/g, gm?'':'')
      .replace(/\[ASCII_ART\][\s\S]*?\[\/ASCII_ART\]/g, am?'':'')
      .replace(/\[SAVE_FILE[^\]]*\][\s\S]*?\[\/SAVE_FILE\]/g,'')
      .replace(/\[LOAD_FILE[^\]]*\]/g,'')
      .replace(/\[SET_ALIAS[^\]]*\][\s\S]*?\[\/SET_ALIAS\]/g,'')
      .replace(/\[REMEMBER\][\s\S]*?\[\/REMEMBER\]/g,'')
      .replace(/\[FORGET\][\s\S]*?\[\/FORGET\]/g,'')
      .replace(/\[FORGET_ALL\]/g,'')
      .trim();
    if(disp) log(disp,'ai');

    if(S.user) saveUser(S.user,S.profile); // fire-and-forget, no sync log spam

  }catch(e){
    document.getElementById(lid)?.remove();
    log('UPLINK_ERR: '+e.message,'err');
    log('Check: are you logged in? Is the AI key valid?','sys');
  }
}

const _cdFolders={}; // runtime cache of unlocked folders: {name:{unlocked,items}}

function inLogPopup(html){

  wrap.innerHTML=html;

  return wrap;
}

async function cdOpen(name){
  if(!S.user){log('Login required.','err');return;}
  const key='cdfolder_'+S.user.toLowerCase()+'_'+name.toLowerCase().replace(/[^a-z0-9_]/g,'_');
  const meta=lsGet(key+'_meta')||await(async()=>{const r=await sbFetch('folders/'+S.user.toLowerCase()+'/'+name+'/.meta');return r?JSON.parse(r):null;})();
  if(!meta){
    log('Folder not found: '+esc(name)+'. Create it with: --cd build dir','err');return;
  }
  if(!_cdFolders[name]||!_cdFolders[name].unlocked){
    // needs password
    const popId='cdpop_'+Date.now();
    const pop=inLogPopup(
      '<div style="font-weight:900;color:var(--accent);margin-bottom:10px;">&#x1F512; ENCRYPTED FOLDER: '+esc(name.toUpperCase())+'</div>'+
      '<div style="font-size:11px;color:#555;margin-bottom:8px;">Enter password to unlock:</div>'+
      '<input id="'+popId+'" type="password" style="background:#111;border:1px solid var(--border);color:#e0e0e0;padding:6px 10px;font-family:inherit;font-size:12px;width:200px;outline:none;border-radius:3px;" placeholder="password..." autofocus>'+
      '<button onclick="cdVerify(\''+name+'\',\''+popId+'\',\''+key+'\',this.closest(\'div[style]\'))" style="background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:var(--accent);padding:6px 14px;margin-left:8px;font-family:inherit;font-size:11px;font-weight:900;cursor:pointer;border-radius:3px;">UNLOCK</button>'+
      '<button onclick="this.closest(\'div[style]\').remove()" style="background:none;border:1px solid var(--border);color:#555;padding:6px 10px;margin-left:4px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:3px;">CANCEL</button>'
    );
    const inp=document.getElementById(popId);
    if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('[onclick*="cdVerify(\''+name+'\'"]')?.click();});
    return;
  }
  // already unlocked &#x2014; show contents
  cdShowContents(name,key,meta);
}

async function cdVerify(name,inpId,key,popEl){
  const val=document.getElementById(inpId)?.value||'';
  const meta=lsGet(key+'_meta')||{};
  const h=await hash(val);
  if(h!==meta.passwordHash){log('Wrong password.','err');return;}
  if(!_cdFolders[name])_cdFolders[name]={};
  _cdFolders[name].unlocked=true;
  popEl?.remove();
  log('FOLDER UNLOCKED: '+esc(name.toUpperCase()),'ok');
  cdShowContents(name,key,meta);
}

async function cdShowContents(name,key,meta){
  const items=lsGet(key+'_items')||[];
  let html='<div style="color:var(--accent);font-weight:900;margin-bottom:8px;">&#x1F4C1; '+esc(name.toUpperCase())+' <span style="color:#444;font-size:10px;font-weight:400;">('+items.length+' items)</span></div>';
  if(!items.length){html+='<div style="color:#444;font-size:11px;margin-bottom:8px;">Empty. Drag files here or use --cd add '+esc(name)+' (filename)</div>';}
  else{
    items.forEach((item,i)=>{
      const icon=item.type==='image'?'&#x1F5BC;':item.type==='audio'?'&#x1F50A;':item.type==='video'?'&#x1F3AC;':item.type==='json'?'{}':'&#x1F4C4;';
      html+='<div style="display:flex;align-items:center;gap:8px;margin:4px 0;padding:4px 6px;border-radius:3px;cursor:pointer;" onmouseover="this.style.background=\'rgba(255,255,255,.03)\'" onmouseout="this.style.background=\'none\'">'
        +'<span>'+icon+'</span>'
        +'<span style="flex:1;font-size:12px;">'+esc(item.name)+'</span>'
        +'<span style="color:#444;font-size:10px;">'+esc(item.size||'')+'</span>'
        +'<span style="color:#ff3333;font-size:10px;cursor:pointer;margin-left:8px;" onclick="cdRemove(\''+esc(name)+'\','+i+')">&#x2715;</span>'
        +'</div>';
    });
  }
  html+='<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px;display:flex;gap:6px;align-items:center;">'
    +'<label style="background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.2);color:var(--ok);padding:4px 10px;font-size:10px;font-weight:900;cursor:pointer;border-radius:3px;">'
    +'+ ADD FILE<input type="file" multiple style="display:none;" onchange="cdAddFiles(\''+esc(name)+'\',\''+esc(key)+'\',this)">'
    +'</label>'
    +'<span style="color:#333;font-size:10px;">Accepts any file type</span>'
    +'</div>';
  inLogPopup(html);
}

function cdAddFiles(name,key,inp){
  const files=Array.from(inp.files);
  if(!files.length)return;
  const items=lsGet(key+'_items')||[];
  let done=0;
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=ev=>{
      const ext=file.name.split('.').pop().toLowerCase();
      const type=['jpg','jpeg','png','gif','webp','svg'].includes(ext)?'image':
                 ['mp3','ogg','wav','m4a'].includes(ext)?'audio':
                 ['mp4','webm','mov'].includes(ext)?'video':
                 ext==='json'?'json':'file';
      items.push({name:file.name,type,data:ev.target.result,size:Math.round(file.size/1024)+'KB',added:Date.now()});
      lsSet(key+'_items',items);
      done++;
      if(done===files.length){
        log(done+' file(s) added to '+esc(name)+'.','ok');
        cdShowContents(name,key,{});
      }
    };
    r.readAsDataURL(file);
  });
  inp.value='';
}

function cdRemove(name,idx){
  const key='cdfolder_'+S.user.toLowerCase()+'_'+name.toLowerCase().replace(/[^a-z0-9_]/g,'_');
  const items=lsGet(key+'_items')||[];
  const removed=items.splice(idx,1)[0];
  lsSet(key+'_items',items);
  log('Removed from '+esc(name)+': '+esc(removed?.name||''),'ok');
}

    '<button onclick="this.closest(\'div[style]\').remove()" style="background:none;border:1px solid var(--border);color:#555;padding:5px 10px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:3px;">CANCEL</button>'+

async function cdCreate(name,popId,popEl){
  const finalName=(name||document.getElementById(popId+'_name')?.value||'').trim().replace(/[^a-z0-9_-]/gi,'_');
  const pw=document.getElementById(popId+'_pw')?.value||'';
  if(!finalName){log('Enter a folder name.','err');return;}
  if(pw.length<3){log('Password must be at least 3 characters.','err');return;}
  const key='cdfolder_'+S.user.toLowerCase()+'_'+finalName.toLowerCase();
  const existing=lsGet(key+'_meta');
  if(existing){log('Folder already exists: '+esc(finalName),'err');return;}
  const h=await hash(pw);
  const meta={name:finalName,passwordHash:h,created:Date.now(),owner:S.user};
  lsSet(key+'_meta',meta);lsSet(key+'_items',[]);
  sbWrite('folders/'+S.user.toLowerCase()+'/'+finalName+'/.meta',JSON.stringify(meta));
  popEl?.remove();
  log('Encrypted folder created: '+esc(finalName.toUpperCase())+'. Open it with: cd| '+esc(finalName),'ok');
}

/* BUCKET LIST */
async function sbList(prefix=''){try{const r=await fetch(`${SB_URL}/storage/v1/object/list/${BUCKET}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({prefix,limit:200,offset:0})});return r.ok?await r.json():[];}catch{return[];}}
async function listBucket(org=false){
  log('SCANNING...','sys');
  try{
    const root=await sbList(''),users=await sbList('users/');
    let files=[...(Array.isArray(root)?root.filter(f=>f.name&&!f.name.endsWith('/')):[]),...(Array.isArray(users)?users.filter(f=>f.name).map(f=>({...f,name:'users/'+f.name})):[])];
    if(!files.length){const lk=Object.keys(localStorage).filter(k=>k.startsWith('dc3_'));files=lk.map(k=>({name:k.replace('dc3_','')+'  [LOCAL]',metadata:{},updated_at:null}));if(files.length)log('CLOUD UNREACHABLE &#x2014; local cache:','sys');}
    if(!files.length){log('NO FILES FOUND.','sys');return;}
    if(org){const cats={USERS:[],GAMES:[],APPS:[],DATA:[],OTHER:[]};files.forEach(f=>{const n=f.name.toLowerCase();if(n.startsWith('users/'))cats.USERS.push(f);else if(n.includes('game'))cats.GAMES.push(f);else if(n.endsWith('.html')||n.endsWith('.js'))cats.APPS.push(f);else if(n.endsWith('.json')||n.endsWith('.sql'))cats.DATA.push(f);else cats.OTHER.push(f);});let h='<div class="hb">';for(const[cat,fs]of Object.entries(cats)){if(!fs.length)continue;h+=`<div style="color:var(--accent);font-weight:900;margin:8px 0 3px">── ${cat} ──</div>`;fs.forEach(f=>{const sz=f.metadata?.size?Math.round(f.metadata.size/1024)+'KB':'?';h+=`<div class="inf">&nbsp;&nbsp;${esc(f.name)} <span style="color:#333">[${sz}]</span></div>`;});}h+='</div>';log(h,'inf');}
    else{let h='<table class="ltable"><tr><th>NAME</th><th>SIZE</th><th>UPDATED</th></tr>';files.forEach(f=>{const sz=f.metadata?.size?Math.round(f.metadata.size/1024)+'KB':'&#x2014;';const up=f.updated_at?f.updated_at.slice(0,10):'&#x2014;';h+=`<tr><td>${esc(f.name)}</td><td>${sz}</td><td>${up}</td></tr>`;});h+='</table>';log(h,'inf');}
  }catch(e){log('LIST_ERR: '+e.message,'err');}
}

async function finishLogin(name,profile){
